<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Feedback — MedTrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="../js/config.js"></script>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#6366f1;--teal:#00c9b1;--gold:#f59e0b;--ink:#0a0a14;--surf:#1e1e30;--text:#e2e8f0;--text2:#94a3b8;--border:rgba(255,255,255,.1)}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--text);min-height:100vh;padding:20px;display:flex;align-items:flex-start;justify-content:center;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(99,102,241,.1),transparent 60%),radial-gradient(ellipse 60% 70% at 80% 80%,rgba(0,201,177,.08),transparent 60%),var(--ink);z-index:0}
.card{position:relative;z-index:1;background:rgba(30,30,48,.97);border:1px solid var(--border);border-radius:24px;padding:32px 28px;width:100%;max-width:500px;margin:20px auto;box-shadow:0 32px 64px rgba(0,0,0,.5)}
.header{text-align:center;margin-bottom:24px}
.icon-wrap{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;box-shadow:0 10px 28px rgba(99,102,241,.3)}
h1{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2)}
.training-box{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:12px;padding:12px 14px;margin-bottom:22px;text-align:center}
.training-box .t-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#a5b4fc;margin-bottom:3px}
.training-box .t-meta{font-size:12px;color:var(--text2)}
.step{display:none}.step.active{display:block}
.section-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
label{display:block;font-size:14px;font-weight:500;color:var(--text);margin-bottom:10px}
.star-row{display:flex;gap:6px;margin-bottom:6px}
.star{font-size:34px;color:rgba(255,255,255,.15);cursor:pointer;transition:all .15s;line-height:1;user-select:none}
.star.lit{color:var(--gold);text-shadow:0 0 12px rgba(245,158,11,.5)}
.star:hover{transform:scale(1.15)}
.scale-row{display:flex;gap:6px;flex-wrap:wrap}
.scale-btn{width:46px;height:46px;border:1.5px solid var(--border);border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer;font-size:16px;font-weight:700;color:var(--text2);font-family:inherit;transition:all .15s}
.scale-btn.sel{background:linear-gradient(135deg,var(--blue),var(--teal));color:white;border-color:transparent;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.mcq-list{display:flex;flex-direction:column;gap:8px}
.mcq-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px;transition:all .15s}
.mcq-opt:hover{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.06)}
.mcq-opt.sel{border-color:var(--blue);background:rgba(99,102,241,.12);color:#a5b4fc;font-weight:500}
.mcq-opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mcq-opt.sel .dot::after{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
textarea{width:100%;padding:11px 14px;background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical;min-height:72px;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
.emp-input{width:100%;padding:15px;background:rgba(255,255,255,.06);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:22px;font-family:'Syne',sans-serif;font-weight:800;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none;transition:all .2s}
.emp-input:focus{border-color:var(--blue);background:rgba(99,102,241,.06)}
.emp-found{margin-top:10px;padding:12px;background:rgba(0,201,177,.06);border:1px solid rgba(0,201,177,.2);border-radius:10px;font-size:13px;display:none}
.emp-found strong{font-size:15px;display:block;margin-bottom:2px;color:var(--teal)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;transition:all .22s;margin-top:8px;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,var(--blue),#4f46e5);color:white;box-shadow:0 6px 20px rgba(99,102,241,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(99,102,241,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.fg{margin-bottom:20px}
.divider{height:1px;background:var(--border);margin:20px 0}
.result{display:none;text-align:center;padding:20px 0}
.result-icon{font-size:68px;animation:pop .5s ease;margin-bottom:10px}
.result-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:8px}
.result-msg{font-size:14px;color:var(--text2)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="header">
    <div class="icon-wrap">📝</div>
    <h1>Training Feedback</h1>
    <p class="sub">Your feedback helps us improve future training</p>
  </div>

  <div class="training-box" id="trainingBox">
    <div class="spinner" style="border-top-color:var(--blue);border-color:rgba(99,102,241,.2)"></div>
  </div>

  <!-- Step 1: Employee ID -->
  <div class="step active" id="step1">
    <div class="fg">
      <label>Your Employee ID</label>
      <input type="text" class="emp-input" id="empId" placeholder="EMP001" oninput="onEmpInput(this)" maxlength="10">
      <div class="emp-found" id="empFound"></div>
    </div>
    <button class="btn btn-primary" onclick="gotoStep2()">Continue →</button>
  </div>

  <!-- Step 2: Feedback form -->
  <div class="step" id="step2">
    <div id="empBar" style="background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:13px"></div>

    <div class="section-label">Trainer Evaluation</div>
    <div class="fg">
      <label>How would you rate the trainer?</label>
      <div class="star-row" id="trainerStars">
        ${[1,2,3,4,5].map(v=>`<span class="star" onclick="setStar('trainer',${v})">★</span>`).join('')}
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Training Evaluation</div>
    <div id="dynQuestions"></div>

    <div class="fg">
      <label>Overall Training Rating</label>
      <div class="star-row" id="overallStars">
        ${[1,2,3,4,5].map(v=>`<span class="star" onclick="setStar('overall',${v})">★</span>`).join('')}
      </div>
    </div>
    <div class="fg">
      <label>Additional Comments <span style="color:var(--text2);font-weight:400">(optional)</span></label>
      <textarea id="comments" placeholder="Any suggestions or things you'd like to share..."></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitFeedback()">Submit Feedback ✓</button>
  </div>

  <!-- Result -->
  <div class="result" id="resultDiv">
    <div class="result-icon">🙏</div>
    <div class="result-title">Thank You!</div>
    <div class="result-msg" id="resultMsg">Your feedback has been recorded successfully.</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const tid = params.get('tid') || '';
let trainingData = null, templateData = null, empData = null, empLookupTimer = null;
const ratings = { trainer: 0, overall: 0 };
const dynResponses = {};
const isDemo = CONFIG.API_URL.includes('YOUR_DEPLOYMENT_ID');

const demoTemplate = {
  TemplateID: 'TMPL001', TemplateName: 'Standard Feedback',
  Questions: JSON.stringify([
    { type:'rating', label:'Rate the training content quality' },
    { type:'scale', label:'Was the training duration appropriate? (1=Too short, 5=Too long)' },
    { type:'mcq', label:'Would you recommend this training to colleagues?', options:['Definitely Yes','Probably Yes','Not Sure','No'] },
    { type:'text', label:'What was the most valuable part of this training?' }
  ])
};

window.addEventListener('load', async () => {
  if (!tid) { setTBox('❌ Invalid QR Code',''); return; }
  if (isDemo) {
    trainingData = { Title:'Advanced Cardiac Life Support', Department:'Cardiology', StartDate:'2025-01-10', Status:'Active' };
    templateData = demoTemplate;
    setTBox(trainingData.Title, `${trainingData.Department} · ${trainingData.StartDate}`);
    renderDynQuestions();
    document.getElementById('empId').focus();
    return;
  }
  const [tRes, tmplRes] = await Promise.all([
    API.call('getTraining',{trainingId:tid}),
    API.call('getTrainingFeedbackTemplate',{trainingId:tid})
  ]);
  trainingData = tRes.data;
  templateData = tmplRes.data;
  if (!trainingData) { setTBox('❌ Training not found',''); return; }
  setTBox(trainingData.Title,`${trainingData.Department} · ${trainingData.StartDate}`);
  renderDynQuestions();
  document.getElementById('empId').focus();
});

function setTBox(name, meta) {
  document.getElementById('trainingBox').innerHTML = `<div class="t-name">${name}</div><div class="t-meta">${meta}</div>`;
}

// Employee lookup
function onEmpInput(el) {
  el.value = el.value.toUpperCase();
  document.getElementById('empFound').style.display = 'none';
  empData = null;
  clearTimeout(empLookupTimer);
  if (el.value.length >= 3) empLookupTimer = setTimeout(() => lookupEmp(el.value), 500);
}

async function lookupEmp(id) {
  if (isDemo) {
    const d = { EMP001:{Name:'Ravi Kumar',Designation:'Nurse',Department:'Emergency'}, EMP002:{Name:'Priya Nair',Designation:'Senior Nurse',Department:'Emergency'}, EMP007:{Name:'Arun T.',Designation:'Cardiologist',Department:'Cardiology'} };
    empData = d[id] || null;
  } else {
    const r = await API.call('lookupEmployee',{empId:id});
    empData = r.data || null;
  }
  const el = document.getElementById('empFound');
  if (empData) {
    el.style.display = 'block';
    el.innerHTML = `<strong>${empData.Name}</strong>${empData.Designation} · ${empData.Department}`;
  } else {
    el.style.display = 'none';
  }
}

function gotoStep2() {
  const id = document.getElementById('empId').value.trim().toUpperCase();
  if (!id || !empData) return alert('Please enter a valid Employee ID.');
  document.getElementById('empBar').innerHTML = `<strong style="color:#a5b4fc">${empData.Name}</strong> &nbsp;·&nbsp; ${empData.Designation}, ${empData.Department}`;
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
}

function renderDynQuestions() {
  if (!templateData) return;
  let qs = [];
  try { qs = JSON.parse(templateData.Questions); } catch(e) {}
  document.getElementById('dynQuestions').innerHTML = qs.map((q,i) => {
    let input = '';
    if (q.type==='rating') {
      input = `<div class="star-row" id="dqstars${i}">${[1,2,3,4,5].map(v=>`<span class="star" onclick="setDynStar(${i},${v})">★</span>`).join('')}</div>`;
    } else if (q.type==='scale') {
      input = `<div class="scale-row">${[1,2,3,4,5].map(v=>`<button class="scale-btn" id="dqscale${i}${v}" onclick="setScale(${i},${v})">${v}</button>`).join('')}</div>`;
    } else if (q.type==='mcq'&&q.options) {
      input = `<div class="mcq-list">${q.options.map((o,j)=>`<div class="mcq-opt" id="dqmcq${i}${j}" onclick="setMCQ(${i},${j},'${o.replace(/'/g,"\\'")}')"><div class="dot"></div>${o}</div>`).join('')}</div>`;
    } else if (q.type==='text') {
      input = `<textarea id="dqtext${i}" placeholder="Your answer..." oninput="dynResponses[${i}]=this.value"></textarea>`;
    }
    return `<div class="fg"><label>${q.label}</label>${input}</div>`;
  }).join('');
}

function setStar(type, val) {
  ratings[type] = val;
  const id = type==='trainer'?'trainerStars':'overallStars';
  document.getElementById(id).querySelectorAll('.star').forEach((s,i) => s.classList.toggle('lit', i<val));
}
function setDynStar(qi, val) {
  dynResponses[qi] = val;
  document.getElementById('dqstars'+qi).querySelectorAll('.star').forEach((s,i) => s.classList.toggle('lit', i<val));
}
function setScale(qi, val) {
  dynResponses[qi] = val;
  for(let v=1;v<=5;v++){const el=document.getElementById('dqscale'+qi+v);if(el)el.classList.toggle('sel',v===val);}
}
function setMCQ(qi, ji, val) {
  dynResponses[qi] = val;
  const qs = JSON.parse(templateData.Questions);
  qs[qi].options.forEach((_,j)=>{const el=document.getElementById('dqmcq'+qi+j);if(el)el.classList.toggle('sel',j===ji);});
}

async function submitFeedback() {
  if (!ratings.trainer) return alert('Please rate the trainer.');
  if (!ratings.overall) return alert('Please give an overall rating.');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Submitting...';
  const empId = document.getElementById('empId').value.trim().toUpperCase();
  const comments = document.getElementById('comments').value.trim();
  let qs = []; try{qs=JSON.parse(templateData?.Questions||'[]');}catch(e){}
  qs.forEach((_,i)=>{if(document.getElementById('dqtext'+i))dynResponses[i]=document.getElementById('dqtext'+i).value;});
  if (isDemo) {
    await new Promise(r=>setTimeout(r,800));
    showResult('Feedback submitted successfully! Thank you.');
    return;
  }
  const res = await API.call('submitFeedback',{trainingId:tid,employeeId:empId,templateId:templateData?.TemplateID||'',responses:dynResponses,trainerRating:ratings.trainer,overallRating:ratings.overall,comments});
  if (res.success) showResult(res.message);
  else { btn.disabled=false; btn.textContent='Submit Feedback ✓'; alert(res.message); }
}

function showResult(msg) {
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.remove('active');
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultDiv').style.display = 'block';
}
</script>
</body>
</html>
