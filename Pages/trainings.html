<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainings — MAH Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar" id="topbar"></div>
    <main class="main" id="main">
      <div class="loader-full"><span class="spinner"></span><span style="margin-left:10px;color:var(--text2)">Loading trainings...</span></div>
    </main>
  </div>
</div>
<script>
let allTrainings=[], allDepts=[], currentUser=null;

document.addEventListener('DOMContentLoaded', async()=>{
  currentUser = Shell.init();
  if(!currentUser) return;
  Shell.setTopbarActions(`<button class="btn btn-primary" onclick="openForm()">＋ New Training</button>`);
  [allTrainings, allDepts] = await Promise.all([
    SmartAPI.getTrainings(currentUser.role, currentUser.department),
    SmartAPI.getDepartments()
  ]);
  render();
});

function render(){
  document.getElementById('main').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Trainings</div><div class="page-sub">${allTrainings.length} training programs</div></div>
      <button class="btn btn-primary btn-lg" onclick="openForm()">＋ New Training</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap" id="chips">
      ${['All','Draft','Scheduled','Active','Completed','Archived'].map((s,i)=>
        `<button class="chip ${i===0?'chip-active':''}" onclick="filterStatus('${s}',this)">${s}</button>`
      ).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <input type="text" id="srch" placeholder="🔍  Search title, dept, trainer..."
        style="flex:1;min-width:180px;padding:10px 14px;background:var(--surf3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none"
        oninput="filterTable()">
      <select id="deptF" onchange="filterTable()"
        style="padding:10px 14px;background:var(--surf3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;min-width:160px">
        <option value="">All Departments</option>
        ${allDepts.map(d=>`<option value="${d.DeptName}">${d.DeptName}</option>`).join('')}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap"><table>
        <thead><tr><th>Training</th><th>Department</th><th>Date & Time</th><th>Venue</th><th>Trainer</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody">${rows(allTrainings)}</tbody>
      </table></div>
    </div>`;
}

function rows(list){
  if(!list.length) return `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No trainings found</div><div class="empty-sub">Create your first training to get started</div></div></td></tr>`;
  return list.map(t=>`
    <tr style="cursor:pointer" onclick="location.href='training-detail.html?id=${t.TrainingID}'">
      <td>
        <div style="font-weight:600">${t.Title||'<em style="color:var(--text3)">Untitled</em>'}</div>
        <div style="font-size:11px;color:var(--text3)">${t.Subject||''}</div>
        <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">
          ${t.CertificateEnabled==='TRUE'?'<span style="font-size:10px;background:var(--violfade);color:#a78bfa;padding:1px 6px;border-radius:4px">🏆 Cert</span>':''}
          ${t.PreExamRequired==='TRUE'?'<span style="font-size:10px;background:var(--goldfade);color:var(--gold);padding:1px 6px;border-radius:4px">Pre-Exam</span>':''}
          ${t.PostExamRequired==='TRUE'?'<span style="font-size:10px;background:var(--redfade);color:var(--red);padding:1px 6px;border-radius:4px">Post-Exam</span>':''}
        </div>
      </td>
      <td style="font-size:12px;max-width:130px;white-space:normal">${t.Department||'—'}</td>
      <td><div>${Utils.formatDate(t.StartDate)}</div><div style="font-size:11px;color:var(--text3)">${t.StartTime||''}${t.EndTime?'–'+t.EndTime:''}</div></td>
      <td style="color:var(--text2);font-size:13px">${t.Venue||'—'}</td>
      <td style="color:var(--text2);font-size:13px">${t.TrainerName||'—'}</td>
      <td><span class="badge badge-${Utils.statusColor(t.Status)}">${t.Status}</span></td>
      <td onclick="event.stopPropagation()">
        <div class="btn-group" style="gap:5px">
          <a href="training-detail.html?id=${t.TrainingID}" class="btn btn-ghost btn-sm">Open</a>
          ${t.Status==='Scheduled'?`<button class="btn btn-success btn-sm" onclick="changeStatus('${t.TrainingID}','Active')">▶ Activate</button>`:''}
          ${t.Status==='Active'?`<button class="btn btn-primary btn-sm" onclick="changeStatus('${t.TrainingID}','Completed')">✓ Complete</button>`:''}
          ${(t.Status==='Draft'||t.Status==='Scheduled')?`<button class="btn btn-ghost btn-sm" onclick="openForm('${t.TrainingID}')">✏️</button>`:''}
        </div>
      </td>
    </tr>`).join('');
}

let statusF='All';
function filterStatus(s,el){ statusF=s; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('chip-active')); el.classList.add('chip-active'); filterTable(); }
function filterTable(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const d=document.getElementById('deptF').value;
  let f=allTrainings;
  if(statusF!=='All') f=f.filter(t=>t.Status===statusF);
  if(d) f=f.filter(t=>(t.Department||'').includes(d));
  if(q) f=f.filter(t=>(t.Title||'').toLowerCase().includes(q)||(t.Subject||'').toLowerCase().includes(q)||(t.TrainerName||'').toLowerCase().includes(q)||(t.Department||'').toLowerCase().includes(q));
  document.getElementById('tbody').innerHTML=rows(f);
}

async function changeStatus(id,status){
  if(!confirm(status==='Active'?'Activate training? QR codes will go live.':'Complete training? HR will be notified.')) return;
  const res=await SmartAPI.updateStatus(id,status);
  if(res.success){ const t=allTrainings.find(x=>x.TrainingID===id); if(t) t.Status=status; filterTable(); Toast.show(status==='Active'?'Training activated! QR codes are live.':'Training completed! HR notified.','success'); }
  else Toast.show('Error.','error');
}

function openForm(tid){
  const t=tid?allTrainings.find(x=>x.TrainingID===tid):null;
  const v=k=>(t&&t[k])||'';

  // Build multi-select department checkboxes
  const selDepts = (v('Department')||'').split(',').map(s=>s.trim()).filter(Boolean);
  const deptChecks = allDepts.map(d=>
    `<label style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surf3);border-radius:8px;cursor:pointer;margin-bottom:4px;font-size:13px">
      <input type="checkbox" name="dept_cb" value="${d.DeptName}" ${selDepts.includes(d.DeptName)?'checked':''} style="accent-color:var(--teal);width:15px;height:15px">
      ${d.DeptName}
    </label>`
  ).join('');

  Modal.open(tid?'Edit Training':'New Training',`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" class="fg2">
      ${fi('Training Title *','tTitle',v('Title'),'e.g. Hand Hygiene Training')}
      ${fi('Subject / Topic *','tSubject',v('Subject'),'e.g. Infection Control')}
    </div>
    <div class="fg">
      <label style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:8px">Departments * (select all that apply)</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:200px;overflow-y:auto;padding:4px;background:var(--surf2);border:1.5px solid var(--border);border-radius:10px">
        ${deptChecks}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" class="fg2">
      ${fi('Venue / Location *','tVenue',v('Venue'),'e.g. Conference Hall A')}
      ${fi('Trainer Name','tTrainer',v('TrainerName'),'Full name of trainer')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px" class="fg3">
      ${fi('Date *','tDate',v('StartDate'),'','date')}
      ${fi('Start Time','tStart',v('StartTime'),'','time')}
      ${fi('End Time','tEnd',v('EndTime'),'','time')}
    </div>
    ${fi('Expected Attendees','tExp',v('ExpectedAttendees'),'0','number')}
    <div class="fg"><label>Description</label><textarea id="tDesc" rows="2" style="width:100%;resize:none">${v('Description')}</textarea></div>
    <div class="card" style="background:var(--surf3);margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:10px">⚙️ Training Settings</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
        <label class="check-row"><input type="checkbox" id="tPre" ${v('PreExamRequired')==='TRUE'?'checked':''}> Pre-exam required</label>
        <label class="check-row"><input type="checkbox" id="tPost" ${v('PostExamRequired')==='TRUE'?'checked':''}> Post-exam required</label>
        <label class="check-row"><input type="checkbox" id="tShow" ${v('ShowExamResults')==='TRUE'?'checked':''}> Show results to employee</label>
        <label class="check-row"><input type="checkbox" id="tCert" ${v('CertificateEnabled')==='TRUE'?'checked':''}> 🏆 Enable certificate</label>
      </div>
    </div>
    <div class="btn-group" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
      <button class="btn btn-primary btn-lg" onclick="save('${tid||''}')">💾 Save Training</button>
    </div>
  `,'modal-lg');
}

function fi(label,id,val,ph,type='text'){
  return `<div class="fg"><label>${label}</label><input type="${type}" id="${id}" value="${val||''}" placeholder="${ph||''}"></div>`;
}
function gv(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function gc(id){const e=document.getElementById(id);return e&&e.checked?'TRUE':'FALSE';}

async function save(tid){
  // Collect multi-select departments
  const deptChecks=document.querySelectorAll('input[name="dept_cb"]:checked');
  const dept=[...deptChecks].map(c=>c.value).join(',');
  if(!dept){Toast.show('Please select at least one department.','warning');return;}

  const data={
    TrainingID:tid||null, Title:gv('tTitle'), Subject:gv('tSubject'),
    Department:dept, Venue:gv('tVenue'), TrainerName:gv('tTrainer'),
    StartDate:gv('tDate'), StartTime:gv('tStart'), EndTime:gv('tEnd'),
    ExpectedAttendees:gv('tExp'), Description:gv('tDesc'),
    PreExamRequired:gc('tPre'), PostExamRequired:gc('tPost'),
    ShowExamResults:gc('tShow'), CertificateEnabled:gc('tCert'),
    CreatedBy:currentUser.employeeId||currentUser.id
  };
  if(!data.Title||!data.StartDate||!data.Venue){Toast.show('Fill: Title, Venue, Date.','warning');return;}
  const res=await SmartAPI.saveTraining(data);
  if(res.success){Modal.close();Toast.show('Training saved!','success');allTrainings=await SmartAPI.getTrainings(currentUser.role,currentUser.department);filterTable();}
  else Toast.show(res.message||'Error saving.','error');
}
</script>
<style>
.chip{padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);background:none;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.chip-active{background:var(--tealfade);border-color:rgba(0,201,177,.35);color:var(--teal)}
@media(max-width:700px){.fg2,.fg3{grid-template-columns:1fr!important}}
</style>
</body>
</html>
