<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup Check — MAH Training System</title>
<script src="js/config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',Arial,sans-serif;background:#0a0e1a;color:#e8edf5;min-height:100vh;padding:32px 20px}
.wrap{max-width:680px;margin:0 auto}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo-row img{height:44px;background:white;padding:3px 6px;border-radius:8px}
.logo-row h1{font-size:18px;font-weight:700;color:#fff}
.logo-row p{font-size:12px;color:#94a3b8}
h2{font-size:20px;font-weight:700;margin-bottom:18px;color:#00b4d8}
.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:24px;margin-bottom:20px}
.status-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.status-row:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot-ok{background:#10b981;box-shadow:0 0 8px #10b981}
.dot-fail{background:#ef4444;box-shadow:0 0 8px #ef4444}
.dot-warn{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
.dot-spin{border:2px solid rgba(255,255,255,.2);border-top-color:#00b4d8;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.s-label{font-weight:600;font-size:14px;flex:1}
.s-detail{font-size:12px;color:#94a3b8;margin-top:3px}
.s-val{font-size:12px;color:#10b981;font-family:monospace;word-break:break-all}
.s-err{font-size:12px;color:#ef4444}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#003399,#0066ff);color:#fff;box-shadow:0 4px 14px rgba(0,51,153,.4)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);color:#94a3b8;border:1px solid rgba(255,255,255,.1);margin-left:10px}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.url-box{background:#0a0e1a;border:1.5px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-family:monospace;font-size:12px;color:#00b4d8;word-break:break-all;margin:10px 0}
.warn-box{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-left:4px solid #f59e0b;border-radius:8px;padding:12px 14px;font-size:13px;color:#fcd34d;margin:12px 0;line-height:1.6}
.ok-box{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-left:4px solid #10b981;border-radius:8px;padding:12px 14px;font-size:13px;color:#6ee7b7;margin:12px 0}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-left:4px solid #ef4444;border-radius:8px;padding:12px 14px;font-size:13px;color:#fca5a5;margin:12px 0;line-height:1.6}
.step-list{list-style:decimal;padding-left:20px;font-size:13px;color:#94a3b8;line-height:2}
.step-list li strong{color:#fff}
a{color:#00b4d8;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="logo-row">
    <img src="assets/logo.jpg" alt="MAH" onerror="this.style.display='none'">
    <div>
      <h1>Training System — Setup Checker</h1>
      <p>Marengo Asia Hospitals · Diagnose connection issues</p>
    </div>
  </div>

  <!-- Status Card -->
  <div class="card">
    <h2>🔍 Connection Diagnostics</h2>
    <div id="checks">
      <div class="status-row">
        <div class="dot dot-spin" id="d1"></div>
        <div><div class="s-label">Checking config.js...</div></div>
      </div>
    </div>
  </div>

  <!-- Action Card -->
  <div class="card" id="actionCard" style="display:none">
    <h2 id="actionTitle"></h2>
    <div id="actionBody"></div>
    <div style="margin-top:18px">
      <button class="btn btn-primary" onclick="runChecks()">🔄 Re-run Checks</button>
      <a href="index.html"><button class="btn btn-ghost">← Back to Login</button></a>
    </div>
  </div>

  <!-- Always show back button -->
  <div style="margin-top:12px;text-align:center">
    <a href="index.html" style="color:#64748b;font-size:13px">← Back to Login Page</a>
  </div>

</div>

<script>
async function runChecks() {
  const checksEl = document.getElementById('checks');
  const actionCard = document.getElementById('actionCard');
  actionCard.style.display = 'none';

  const results = [];

  // ── Check 1: config.js loaded ─────────────────────────────
  checksEl.innerHTML = checkRow('spin','Checking config.js...','');
  await wait(200);

  const configOk = typeof CONFIG !== 'undefined' && CONFIG.API_URL;
  results.push({ ok: configOk, label: 'config.js loaded', detail: configOk ? 'CONFIG object found' : 'CONFIG not defined — config.js not loaded' });

  // ── Check 2: Is Demo Mode? ────────────────────────────────
  const isDemo = !configOk || CONFIG.isDemo;
  results.push({
    ok: !isDemo,
    warn: isDemo,
    label: isDemo ? '⚠ Demo Mode active (API_URL not configured)' : '✅ Real API URL configured',
    detail: isDemo
      ? 'CONFIG.API_URL still contains YOUR_DEPLOYMENT_ID — edit js/config.js with your real Apps Script URL'
      : CONFIG.API_URL.substring(0, 60) + '...'
  });

  // ── Check 3: Session storage ─────────────────────────────
  let storageOk = false;
  try { sessionStorage.setItem('_test','1'); sessionStorage.removeItem('_test'); storageOk = true; } catch(e){}
  results.push({ ok: storageOk, label: 'Browser sessionStorage available', detail: storageOk ? 'Sessions will work correctly' : 'sessionStorage blocked — try a different browser' });

  // ── Check 4: API Ping (only if not demo) ─────────────────
  checksEl.innerHTML = renderRows(results) + checkRow('spin','Testing Apps Script connection...','');

  let apiOk = false, apiMsg = '', apiDetail = '';
  if (!isDemo) {
    try {
      const res = await Promise.race([
        API.call('ping', {}),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout after 12s')), 12000))
      ]);
      if (res && (res.success || res.pong)) {
        apiOk = true;
        apiMsg = '✅ Apps Script is responding';
        apiDetail = 'Connection successful — backend is reachable';
      } else {
        apiMsg = '❌ Apps Script returned error';
        apiDetail = res?.message || 'Unknown error from server';
      }
    } catch (e) {
      apiMsg = '❌ ' + e.message;
      apiDetail = 'Cannot reach Apps Script. See action steps below.';
    }
    results.push({ ok: apiOk, label: apiMsg, detail: apiDetail });
  } else {
    results.push({ ok: false, warn: true, label: '⚠ API ping skipped (Demo Mode)', detail: 'Configure real API URL first' });
  }

  // ── Check 5: Try login with test credentials ─────────────
  checksEl.innerHTML = renderRows(results) + checkRow('spin','Testing login API...','');

  let loginOk = false, loginMsg = '', loginDetail = '';
  if (!isDemo && apiOk) {
    try {
      const res = await Promise.race([
        API.call('login', { email: 'test@check.com', password: 'wrongpwd' }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), 12000))
      ]);
      // We expect failure (wrong password) but a proper JSON response proves the API works
      if (res && res.success === false && res.message) {
        loginOk = true;
        loginMsg = '✅ Login API working correctly';
        loginDetail = 'API returned: "' + res.message + '" — correct behaviour for wrong password';
      } else if (res && res.success) {
        loginMsg = '⚠ Unexpected: login succeeded with test account';
        loginDetail = 'This should not happen — check your Users sheet';
      }
    } catch(e) {
      loginMsg = '❌ Login API error: ' + e.message;
      loginDetail = 'API reached but login function failed';
    }
    results.push({ ok: loginOk, label: loginMsg, detail: loginDetail });
  } else if (!isDemo) {
    results.push({ ok: false, warn: true, label: '⚠ Login test skipped (API not reachable)', detail: '' });
  }

  checksEl.innerHTML = renderRows(results);

  // ── Show action card ──────────────────────────────────────
  showAction(results, isDemo, apiOk);
}

function renderRows(results) {
  return results.map(r => {
    const dotClass = r.ok ? 'dot-ok' : (r.warn ? 'dot-warn' : 'dot-fail');
    return `<div class="status-row">
      <div class="dot ${dotClass}"></div>
      <div style="flex:1">
        <div class="s-label">${r.label}</div>
        ${r.detail ? `<div class="${r.ok ? 's-val' : (r.warn ? '' : 's-err')}">${r.detail}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function checkRow(type, label, detail) {
  return `<div class="status-row">
    <div class="dot dot-${type}"></div>
    <div><div class="s-label">${label}</div>${detail ? `<div class="s-detail">${detail}</div>` : ''}</div>
  </div>`;
}

function showAction(results, isDemo, apiOk) {
  const card = document.getElementById('actionCard');
  const title = document.getElementById('actionTitle');
  const body = document.getElementById('actionBody');
  card.style.display = 'block';

  const allOk = results.every(r => r.ok || r.warn);

  if (isDemo) {
    title.textContent = '⚙️ Action Required — Connect Google Apps Script';
    body.innerHTML = `
      <div class="warn-box">Your app is running in <strong>Demo Mode</strong>. To use real hospital login credentials, you must connect Google Apps Script.</div>
      <p style="font-size:14px;color:#94a3b8;margin-bottom:12px">Follow these steps:</p>
      <ol class="step-list">
        <li>Go to <a href="https://script.google.com" target="_blank">script.google.com</a></li>
        <li>Open your <strong>MedTrain Backend</strong> project</li>
        <li>Click <strong>Deploy → Manage Deployments</strong></li>
        <li>Copy the <strong>Web App URL</strong></li>
        <li>In your GitHub repo, open <strong>js/config.js</strong></li>
        <li>Replace <code style="color:#00b4d8">YOUR_DEPLOYMENT_ID</code> with your real URL</li>
        <li>Commit the change and wait 2 minutes</li>
      </ol>
      <div class="warn-box" style="margin-top:14px">Also make sure <strong>setupSheets()</strong> was run in Apps Script to create the default admin user.</div>`;
  } else if (!apiOk) {
    title.textContent = '❌ Cannot Reach Apps Script — Fix Required';
    body.innerHTML = `
      <div class="err-box">The app found your API URL but cannot reach it. This is usually one of these problems:</div>
      <p style="font-size:14px;font-weight:600;margin:12px 0">Your Apps Script URL in config.js:</p>
      <div class="url-box">${CONFIG.API_URL}</div>
      <ol class="step-list">
        <li>Go to <a href="https://script.google.com" target="_blank">script.google.com</a> and open your project</li>
        <li>Click <strong>Deploy → Manage Deployments</strong></li>
        <li>Check that <strong>"Who has access"</strong> is set to <strong>"Anyone"</strong> (not "Anyone with Google account")</li>
        <li>If you changed any code, you must <strong>create a New Version</strong> in Manage Deployments</li>
        <li>Copy the URL again — it should end with <code style="color:#00b4d8">/exec</code></li>
        <li>Make sure <strong>setupSheets()</strong> was run at least once</li>
      </ol>`;
  } else {
    title.textContent = '✅ Everything is Working!';
    body.innerHTML = `
      <div class="ok-box">Apps Script is connected and responding correctly. You can log in with your real credentials.</div>
      <p style="font-size:14px;color:#94a3b8;margin:12px 0">Login with your admin account:</p>
      <div style="background:#0a0e1a;border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px">
        <div>Email: <strong style="color:#00b4d8">admin@hospital.com</strong></div>
        <div style="margin-top:6px">Password: <strong style="color:#00b4d8">Admin@123</strong></div>
        <div style="margin-top:6px;color:#64748b;font-size:12px">(Change this password after first login)</div>
      </div>
      <a href="index.html"><button class="btn btn-primary">→ Go to Login Page</button></a>`;
  }
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// Auto-run on page load
document.addEventListener('DOMContentLoaded', runChecks);
</script>
</body>
</html>
