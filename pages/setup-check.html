<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup Check — MAH Training System</title>
<!-- IMPORTANT: from pages/ folder, config.js is one level up -->
<script src="../js/config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',Arial,sans-serif;background:#0a0e1a;color:#e8edf5;min-height:100vh;padding:28px 16px}
.wrap{max-width:660px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.hdr img{height:42px;background:white;padding:3px 6px;border-radius:8px}
.hdr-text h1{font-size:17px;font-weight:700;color:#fff}
.hdr-text p{font-size:12px;color:#94a3b8}
.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:22px;margin-bottom:18px}
h2{font-size:17px;font-weight:700;margin-bottom:16px;color:#00b4d8}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border:none}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ok{background:#10b981;box-shadow:0 0 7px #10b981}
.fail{background:#ef4444;box-shadow:0 0 7px #ef4444}
.warn{background:#f59e0b;box-shadow:0 0 7px #f59e0b}
.spin{border:2px solid rgba(255,255,255,.2);border-top-color:#00b4d8;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lbl{font-weight:600;font-size:14px;color:#e8edf5}
.det{font-size:12px;margin-top:3px;word-break:break-all;line-height:1.5}
.det.g{color:#10b981}.det.r{color:#fca5a5}.det.y{color:#fcd34d}.det.w{color:#94a3b8}
.url{background:#0a0e1a;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 12px;font-family:monospace;font-size:11px;color:#00b4d8;word-break:break-all;margin:10px 0}
.info{border-radius:8px;padding:11px 14px;font-size:13px;margin:10px 0;line-height:1.6;border-left:4px solid}
.info.y{background:rgba(245,158,11,.1);border-color:#f59e0b;color:#fcd34d}
.info.g{background:rgba(16,185,129,.1);border-color:#10b981;color:#6ee7b7}
.info.r{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5}
.info.b{background:rgba(0,180,216,.1);border-color:#00b4d8;color:#7dd3fc}
ol{padding-left:20px;font-size:13px;color:#94a3b8;line-height:2.1}
ol li strong{color:#e8edf5}
ol li code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px;color:#00b4d8}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{padding:11px 22px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:linear-gradient(135deg,#003399,#0066ff);color:#fff;box-shadow:0 4px 14px rgba(0,51,153,.4)}
.btn-p:hover{transform:translateY(-2px)}
.btn-g{background:rgba(255,255,255,.07);color:#94a3b8;border:1px solid rgba(255,255,255,.12)}
.btn-g:hover{background:rgba(255,255,255,.12);color:#fff}
a{color:#00b4d8;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <img src="../assets/logo.jpg" alt="MAH" onerror="this.style.display='none'">
    <div class="hdr-text">
      <h1>Training System — Setup Checker</h1>
      <p>Marengo Asia Hospitals · Diagnose connection issues</p>
    </div>
  </div>

  <div class="card">
    <h2>🔍 Connection Diagnostics</h2>
    <div id="checks"><div class="row"><div class="dot spin"></div><div><div class="lbl">Running checks…</div></div></div></div>
  </div>

  <div class="card" id="actionCard" style="display:none">
    <h2 id="actionTitle"></h2>
    <div id="actionBody"></div>
    <div class="btns">
      <button class="btn btn-p" onclick="run()">🔄 Re-run Checks</button>
      <a class="btn btn-g" href="../index.html">← Back to Login</a>
    </div>
  </div>

  <div style="text-align:center;margin-top:12px">
    <a href="../index.html" style="color:#475569;font-size:12px">← Back to Login</a>
  </div>
</div>

<script>
// Check if CONFIG loaded (it's in ../js/config.js, one level up from pages/)
const configLoaded = typeof CONFIG !== 'undefined' && typeof CONFIG.API_URL === 'string';

async function run() {
  document.getElementById('actionCard').style.display = 'none';
  const out = [];

  // ── 1. config.js ─────────────────────────────────────────
  out.push({
    ok: configLoaded,
    lbl: configLoaded ? '✅ config.js loaded successfully' : '❌ config.js NOT loaded',
    det: configLoaded
      ? 'CONFIG object found — JS file is working'
      : 'CONFIG is undefined. The file js/config.js may be missing from GitHub, or there is a JavaScript error inside it.',
    cls: configLoaded ? 'g' : 'r'
  });
  render(out); await wait(100);

  if (!configLoaded) {
    showAction('❌ config.js Not Loading',
      `<div class="info r">The config.js file cannot be loaded. This blocks everything else.</div>
       <ol>
         <li>Go to your GitHub repository</li>
         <li>Check that a <strong>js/</strong> folder exists</li>
         <li>Check that <strong>js/config.js</strong> exists inside it</li>
         <li>If missing, upload it from the latest ZIP file</li>
       </ol>`);
    return;
  }

  // ── 2. API URL configured? ───────────────────────────────
  const isDemo = CONFIG.isDemo;
  const apiUrl = CONFIG.API_URL || '';
  out.push({
    ok:   !isDemo,
    warn:  isDemo,
    lbl:   isDemo ? '⚠️  Demo Mode — API_URL not configured' : '✅ Real API URL is configured',
    det:   isDemo
      ? 'API_URL still contains YOUR_DEPLOYMENT_ID. Edit js/config.js on GitHub with your real Apps Script URL.'
      : apiUrl.substring(0, 70) + (apiUrl.length > 70 ? '…' : ''),
    cls: isDemo ? 'y' : 'g'
  });
  render(out); await wait(100);

  // ── 3. sessionStorage ────────────────────────────────────
  let storOk = false;
  try {
    sessionStorage.setItem('_chk', '1');
    const v = sessionStorage.getItem('_chk');
    sessionStorage.removeItem('_chk');
    storOk = v === '1';
  } catch {}
  out.push({
    ok: storOk,
    lbl: storOk ? '✅ Browser sessionStorage works' : '❌ sessionStorage blocked',
    det: storOk ? 'Login sessions will save and persist correctly' : 'Use a non-private browser window. Private/Incognito mode sometimes blocks sessionStorage.',
    cls: storOk ? 'g' : 'r'
  });
  render(out); await wait(100);

  if (isDemo) {
    showAction('⚙️  Action: Connect Google Apps Script',
      `<div class="info y">App is running in <strong>Demo Mode</strong>. Demo accounts work, but real hospital users cannot login until you connect Google Apps Script.</div>
       <p style="font-size:14px;color:#94a3b8;margin:12px 0 6px"><strong style="color:#e8edf5">Steps to connect:</strong></p>
       <ol>
         <li>Go to <a href="https://script.google.com" target="_blank">script.google.com</a> → open your <strong>MedTrain Backend</strong> project</li>
         <li>Paste the latest <strong>Code.gs</strong> content (from the ZIP file) into the editor</li>
         <li>Select function <strong>setupSheets</strong> → click <strong>Run ▶</strong> → grant permissions</li>
         <li>Click <strong>Deploy → New Deployment</strong> → Type: Web App → Execute as: Me → Access: <strong>Anyone</strong></li>
         <li>Copy the <strong>Web App URL</strong> (ends with <code>/exec</code>)</li>
         <li>In GitHub → open <strong>js/config.js</strong> → click ✏️ Edit</li>
         <li>Replace <code>YOUR_DEPLOYMENT_ID</code> with your full Web App URL</li>
         <li>Commit → wait 2 minutes → re-run this checker</li>
       </ol>
       <div class="info b" style="margin-top:12px">Default login after setup:<br><strong>admin@hospital.com</strong> / <strong>Admin@123</strong></div>`);
    return;
  }

  // ── 4. Ping Apps Script ───────────────────────────────────
  out.push({ ok:false, warn:true, lbl:'⏳ Testing Apps Script connection…', det:'Sending ping request (up to 20s)…', cls:'w' });
  render(out); 

  let pingOk = false, pingMsg = '', pingDet = '';
  try {
    const res = await Promise.race([
      API.call('ping', {}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('No response after 20 seconds')), 21000))
    ]);
    if (res && (res.pong || res.success)) {
      pingOk = true;
      pingMsg = '✅ Apps Script responded successfully!';
      pingDet = 'Server is reachable — backend is connected.';
    } else {
      pingMsg = '❌ Apps Script returned unexpected response';
      pingDet = JSON.stringify(res).substring(0, 120);
    }
  } catch (e) {
    pingMsg = '❌ ' + e.message;
    pingDet = 'Cannot reach Apps Script. See action steps below.';
  }
  out[out.length-1] = { ok:pingOk, lbl:pingMsg, det:pingDet, cls:pingOk?'g':'r' };
  render(out);

  if (!pingOk) {
    showAction('❌ Cannot Reach Apps Script',
      `<p style="font-size:13px;color:#94a3b8;margin-bottom:8px">Your API URL:</p>
       <div class="url">${apiUrl}</div>
       <div class="info r">The server did not respond. Most common causes:</div>
       <ol>
         <li>Apps Script deployment is set to <strong>"Anyone with Google account"</strong> — must be <strong>"Anyone"</strong> (no Google account required)</li>
         <li>The latest <strong>Code.gs</strong> (with JSONP support) was not deployed — you must create a <strong>New Version</strong> after pasting new code</li>
         <li>The URL was copied incorrectly — it must end with <code>/exec</code></li>
         <li><strong>setupSheets()</strong> was not run — run it once in Apps Script editor</li>
       </ol>
       <div class="info y" style="margin-top:12px"><strong>Fix checklist:</strong><br>
         1. Open Apps Script → paste latest Code.gs → save<br>
         2. Run setupSheets() once<br>
         3. Deploy → Manage Deployments → Edit → New Version → "Anyone" → Update<br>
         4. Copy the new URL → update config.js on GitHub → commit</div>`);
    return;
  }

  // ── 5. Test login API ─────────────────────────────────────
  out.push({ ok:false, warn:true, lbl:'⏳ Testing login API…', det:'', cls:'w' });
  render(out);

  let loginOk = false, loginMsg = '', loginDet = '';
  try {
    const res = await Promise.race([
      API.call('login', { email:'check@test.com', password:'wrongpwd' }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('No response after 20s')), 21000))
    ]);
    if (res && res.success === false && res.message) {
      loginOk = true;
      loginMsg = '✅ Login API working correctly';
      loginDet = 'Response: "' + res.message + '" — correct for wrong password';
    } else if (res && res.success) {
      loginMsg = '⚠️  Unexpected: login accepted test credentials';
      loginDet = 'Check your Users sheet in Google Sheets';
    } else {
      loginMsg = '❌ Login API error';
      loginDet = JSON.stringify(res).substring(0, 100);
    }
  } catch (e) {
    loginMsg = '❌ ' + e.message;
    loginDet = '';
  }
  out[out.length-1] = { ok:loginOk, lbl:loginMsg, det:loginDet, cls:loginOk?'g':'r' };
  render(out);

  // ── Final result ──────────────────────────────────────────
  const allOk = out.every(r => r.ok);
  if (allOk) {
    showAction('✅ Everything is Working!',
      `<div class="info g">Apps Script is connected and the login API is responding correctly.</div>
       <p style="font-size:14px;color:#94a3b8;margin:12px 0 6px">Login credentials:</p>
       <div style="background:#0a0e1a;border-radius:8px;padding:12px 14px;font-size:13px">
         Email: <strong style="color:#00b4d8">admin@hospital.com</strong><br>
         Password: <strong style="color:#00b4d8">Admin@123</strong><br>
         <span style="color:#475569;font-size:11px">(Change after first login)</span>
       </div>
       <div class="btns" style="margin-top:0">
         <a class="btn btn-p" href="../index.html">→ Go to Login</a>
       </div>`);
  }
}

function render(rows) {
  document.getElementById('checks').innerHTML = rows.map(r => {
    const dotCls = r.ok ? 'ok' : (r.warn ? 'warn' : 'fail');
    return `<div class="row">
      <div class="dot ${dotCls}"></div>
      <div style="flex:1">
        <div class="lbl">${r.lbl}</div>
        ${r.det ? `<div class="det ${r.cls||'w'}">${r.det}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function showAction(title, body) {
  document.getElementById('actionTitle').textContent = title;
  document.getElementById('actionBody').innerHTML = body;
  document.getElementById('actionCard').style.display = 'block';
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

document.addEventListener('DOMContentLoaded', run);
</script>
</body>
</html>
