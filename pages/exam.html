<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Exam — MAH Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="../js/config.js"></script>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#f59e0b;--red:#ef4444;--green:#10b981;--ink:#0a0a14;--surf:#1e1e30;--text:#e2e8f0;--text2:#94a3b8;--border:rgba(255,255,255,.1)}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--text);min-height:100vh;padding:20px;display:flex;align-items:flex-start;justify-content:center;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 30% 20%,rgba(245,158,11,.1),transparent 60%),radial-gradient(ellipse 60% 70% at 80% 80%,rgba(239,68,68,.07),transparent 60%),var(--ink);z-index:0}
.card{position:relative;z-index:1;background:rgba(30,30,48,.97);border:1px solid var(--border);border-radius:24px;padding:32px 28px;width:100%;max-width:520px;margin:20px auto;box-shadow:0 32px 64px rgba(0,0,0,.5)}
.header{text-align:center;margin-bottom:22px}
.exam-type-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.pre{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:var(--gold)}
.post{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red)}
h1{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2)}
.training-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:12px;padding:12px 14px;margin-bottom:22px;text-align:center}
.training-box .t-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--gold);margin-bottom:3px}
.training-box .t-meta{font-size:12px;color:var(--text2)}
label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px}
.emp-input{width:100%;padding:15px;background:rgba(255,255,255,.06);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:22px;font-family:'Syne',sans-serif;font-weight:800;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none;transition:all .2s}
.emp-input:focus{border-color:var(--gold);background:rgba(245,158,11,.05)}
.emp-found{margin-top:10px;padding:11px 14px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:10px;font-size:13px;display:none}
.emp-found strong{color:var(--green);display:block;margin-bottom:2px;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;transition:all .22s;margin-top:10px;letter-spacing:.3px}
.btn-start{background:linear-gradient(135deg,var(--gold),#d97706);color:#0a0a14;box-shadow:0 6px 20px rgba(245,158,11,.3)}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(245,158,11,.4)}
.btn-start:disabled{opacity:.5;cursor:not-allowed;transform:none}
.progress-wrap{margin-bottom:20px}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.q-num{font-weight:700;color:var(--gold)}
.marks-badge{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--gold);padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
.prog-bar{background:rgba(255,255,255,.06);border-radius:100px;height:5px}
.prog-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--gold),#d97706);transition:width .35s}
.q-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;margin-bottom:18px;font-size:15px;font-weight:500;line-height:1.55;border-left:3px solid var(--gold)}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;cursor:pointer;font-size:14px;transition:all .17s}
.opt:hover{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.05)}
.opt.sel{border-color:var(--gold);background:rgba(245,158,11,.1);color:var(--gold);font-weight:600}
.opt.correct{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green);font-weight:600}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red)}
.opt-letter{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;font-family:'Syne',sans-serif}
.opt.sel .opt-letter{background:var(--gold);color:#0a0a14}
.opt.correct .opt-letter{background:var(--green);color:#0a0a14}
.opt.wrong .opt-letter{background:var(--red);color:#fff}
.nav-row{display:flex;gap:10px}
.nav-row .btn{margin-top:0;flex:1}
.btn-prev{background:rgba(255,255,255,.06);border:1.5px solid var(--border);color:var(--text2)}
.btn-prev:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn-next{background:linear-gradient(135deg,var(--gold),#d97706);color:#0a0a14}
.result-screen{display:none;text-align:center;padding:10px 0}
.score-ring{width:120px;height:120px;border-radius:50%;border:6px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 0 0 8px rgba(245,158,11,.1);animation:ringIn .5s ease}
.score-pct{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--gold);line-height:1}
.score-frac{font-size:12px;color:var(--text2)}
.result-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px}
.result-msg{font-size:14px;color:var(--text2);margin-bottom:14px}
.pass-badge{display:inline-block;padding:6px 20px;border-radius:100px;font-size:13px;font-weight:700}
.pass-badge.pass{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.pass-badge.fail{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red)}
.review-list{text-align:left;margin-top:18px}
.review-item{padding:11px 13px;border-radius:10px;margin-bottom:8px;font-size:13px}
.review-item.correct{background:rgba(16,185,129,.08);border-left:3px solid var(--green)}
.review-item.wrong{background:rgba(239,68,68,.07);border-left:3px solid var(--red)}
.review-q{font-weight:600;margin-bottom:3px;line-height:1.4}
.review-a{font-size:12px;color:var(--text2)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#0a0a14;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
.step{display:none}.step.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="header">
    <div id="typeBadge"></div>
    <h1 id="examTitle">Training Exam</h1>
    <p class="sub">Read each question carefully before answering</p>
  </div>

  <div class="training-box" id="trainingBox">
    <div class="spinner" style="border-top-color:var(--gold);border-color:rgba(245,158,11,.2)"></div>
  </div>

  <!-- Step 1: Emp ID -->
  <div class="step active" id="step1">
    <div style="margin-bottom:16px">
      <label>Your Employee ID</label>
      <input type="text" class="emp-input" id="empId" placeholder="EMP001" oninput="onEmpIn(this)" maxlength="10">
      <div class="emp-found" id="empFound"></div>
    </div>
    <button class="btn btn-start" id="startBtn" onclick="startExam()">Start Exam →</button>
  </div>

  <!-- Step 2: Questions -->
  <div class="step" id="step2">
    <div class="progress-wrap">
      <div class="prog-top">
        <span class="q-num" id="qNum">Q 1</span>
        <span class="marks-badge" id="qMarks">1 mark</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <div style="font-size:11px;color:var(--text2);text-align:right;margin-top:4px" id="qCounter"></div>
    </div>
    <div class="q-card" id="qText"></div>
    <div class="options" id="qOptions"></div>
    <div class="nav-row">
      <button class="btn btn-prev" id="prevBtn" onclick="prevQ()" style="display:none">← Prev</button>
      <button class="btn btn-next" id="nextBtn" onclick="nextQ()">Next →</button>
    </div>
  </div>

  <!-- Result screen -->
  <div class="result-screen" id="resultScreen"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const tid = params.get('tid') || '';
const examType = params.get('type') || (location.search.includes('preexam') ? 'pre' : 'post');
const isDemo = CONFIG.API_URL.includes('YOUR_DEPLOYMENT_ID');

let qs = [], cur = 0, answers = {}, empId = '', empData = null, lookupTimer = null;

const demoQs = {
  pre: [
    { QID:'Q001', Question:'What does BLS stand for?', OptionA:'Basic Life Support', OptionB:'Body Lung Support', OptionC:'Basic Lung Safety', OptionD:'Body Life System', CorrectOption:'A', Marks:'1' },
    { QID:'Q002', Question:'In CPR, how many chest compressions per minute are recommended for adults?', OptionA:'60–80', OptionB:'80–100', OptionC:'100–120', OptionD:'120–140', CorrectOption:'C', Marks:'1' },
    { QID:'Q003', Question:'What is the correct ratio of compressions to breaths in adult CPR?', OptionA:'15:1', OptionB:'30:2', OptionC:'20:2', OptionD:'15:2', CorrectOption:'B', Marks:'2' },
    { QID:'Q004', Question:'Which of the following is a sign of cardiac arrest?', OptionA:'High blood pressure', OptionB:'Rapid blinking', OptionC:'Unresponsiveness and no normal breathing', OptionD:'Elevated body temperature', CorrectOption:'C', Marks:'1' },
  ],
  post: [
    { QID:'Q101', Question:'After successful CPR, what is the recommended follow-up care?', OptionA:'Leave patient to rest', OptionB:'Immediate defibrillation', OptionC:'Post-resuscitation care and monitoring', OptionD:'Administer paracetamol', CorrectOption:'C', Marks:'2' },
    { QID:'Q102', Question:'An AED should be applied as soon as possible. What is the first step after turning it on?', OptionA:'Begin CPR', OptionB:'Call for help', OptionC:'Attach pads as shown', OptionD:'Check pulse', CorrectOption:'C', Marks:'1' },
    { QID:'Q103', Question:'How deep should chest compressions be for an adult?', OptionA:'1 inch', OptionB:'2–2.4 inches (5–6 cm)', OptionC:'3 inches', OptionD:'Less than 1 inch', CorrectOption:'B', Marks:'2' },
  ]
};

window.addEventListener('load', async () => {
  const label = examType === 'pre' ? 'Pre-Exam' : 'Post-Exam';
  document.getElementById('typeBadge').innerHTML = `<div class="exam-type-badge ${examType}">${label}</div>`;
  document.getElementById('examTitle').textContent = label;
  if (!tid) { setTBox('❌ Invalid QR',''); return; }
  if (isDemo) {
    setTBox('Advanced Cardiac Life Support','Cardiology · 2025-01-10');
    document.getElementById('empId').focus();
    return;
  }
  const res = await API.call('getTraining',{trainingId:tid});
  if (!res.data) { setTBox('❌ Training not found',''); return; }
  const t = res.data;
  const req = examType==='pre' ? t.PreExamRequired : t.PostExamRequired;
  if (req !== 'TRUE') { setTBox(t.Title,'<span style="color:#ef4444">This exam is not enabled</span>'); return; }
  setTBox(t.Title,`${t.Department} · ${Utils.formatDate(t.StartDate)}`);
  document.getElementById('empId').focus();
});

function setTBox(n,m) {
  document.getElementById('trainingBox').innerHTML = `<div class="t-name">${n}</div><div class="t-meta">${m}</div>`;
}

function onEmpIn(el) {
  el.value = el.value.toUpperCase();
  document.getElementById('empFound').style.display = 'none';
  empData = null;
  clearTimeout(lookupTimer);
  if (el.value.length >= 3) lookupTimer = setTimeout(() => lookupEmp(el.value), 500);
}

async function lookupEmp(id) {
  if (isDemo) {
    const d = { EMP001:{Name:'Ravi Kumar',Department:'Emergency',Designation:'Nurse'}, EMP007:{Name:'Arun T.',Department:'Cardiology',Designation:'Cardiologist'} };
    empData = d[id] || null;
  } else {
    const r = await API.call('lookupEmployee',{empId:id});
    empData = r.data || null;
  }
  const el = document.getElementById('empFound');
  if (empData) { el.style.display='block'; el.innerHTML=`<strong>${empData.Name}</strong>${empData.Designation} · ${empData.Department}`; }
  else el.style.display='none';
}

async function startExam() {
  empId = document.getElementById('empId').value.trim().toUpperCase();
  if (!empId || !empData) return alert('Please enter a valid Employee ID.');
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Loading questions...';
  if (isDemo) {
    qs = demoQs[examType] || demoQs.pre;
  } else {
    const res = await API.call('getExamQuestions',{trainingId:tid,examType});
    qs = res.data || [];
  }
  if (!qs.length) { btn.disabled=false; btn.textContent='Start Exam →'; alert('No questions found. Contact organiser.'); return; }
  cur = 0; answers = {};
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  renderQ();
}

function renderQ() {
  const q = qs[cur];
  const total = qs.length;
  document.getElementById('qNum').textContent = `Q ${cur+1}`;
  document.getElementById('qMarks').textContent = `${q.Marks||1} mark${q.Marks>1?'s':''}`;
  document.getElementById('progFill').style.width = `${((cur+1)/total)*100}%`;
  document.getElementById('qCounter').textContent = `${cur+1} of ${total} questions`;
  document.getElementById('qText').textContent = q.Question;
  document.getElementById('prevBtn').style.display = cur>0?'flex':'none';
  document.getElementById('nextBtn').textContent = cur===total-1?'Submit Exam ✓':'Next →';
  const opts = [
    {l:'A',t:q.OptionA},{l:'B',t:q.OptionB},
    {l:'C',t:q.OptionC},{l:'D',t:q.OptionD}
  ].filter(o=>o.t);
  document.getElementById('qOptions').innerHTML = opts.map(o => {
    const sel = answers[q.QID] === o.l;
    return `<div class="opt ${sel?'sel':''}" onclick="selectAns('${q.QID}','${o.l}')">
      <span class="opt-letter">${o.l}</span>${o.t}
    </div>`;
  }).join('');
}

function selectAns(qid, letter) {
  answers[qid] = letter;
  renderQ();
}

function nextQ() {
  const q = qs[cur];
  if (!answers[q.QID]) return alert('Please select an answer before proceeding.');
  if (cur === qs.length-1) {
    if (!confirm(`Submit your ${examType==='pre'?'Pre':'Post'}-Exam? You cannot change answers after this.`)) return;
    submitExam();
  } else { cur++; renderQ(); }
}

function prevQ() { if (cur>0){cur--;renderQ();} }

async function submitExam() {
  const btn = document.getElementById('nextBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Submitting...';

  if (isDemo) {
    const score = qs.reduce((s,q)=>{return s+(answers[q.QID]===q.CorrectOption?(parseInt(q.Marks)||1):0);},0);
    const maxScore = qs.reduce((s,q)=>s+(parseInt(q.Marks)||1),0);
    const pct = Math.round((score/maxScore)*100);
    const details = qs.map(q=>({qid:q.QID,question:q.Question,given:answers[q.QID]||'—',correct:q.CorrectOption,isCorrect:answers[q.QID]===q.CorrectOption,marks:parseInt(q.Marks)||1}));
    showResult({success:true,score,maxScore,percentage:pct,showResults:true,details});
    return;
  }

  const res = await API.call('submitExam',{trainingId:tid,employeeId:empId,examType,answers:JSON.stringify(answers)});
  showResult(res);
}

function showResult(res) {
  document.getElementById('step2').classList.remove('active');
  const screen = document.getElementById('resultScreen');
  screen.style.display = 'block';

  if (!res.success) { screen.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:52px">❌</div><div style="font-size:18px;font-weight:700;margin:10px 0">${res.message||'Error'}</div></div>`; return; }

  if (!res.showResults) {
    screen.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:60px;animation:pop .5s ease">✅</div><div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin:12px 0">Exam Submitted!</div><div style="color:var(--text2);font-size:14px">Your answers have been recorded.<br>Results will be shared by the trainer.</div></div>`;
    return;
  }

  const pass = res.percentage >= 50;
  let reviewHtml = '';
  if (res.details && res.details.length) {
    reviewHtml = `<div class="review-list">
      <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">Answer Review</div>
      ${res.details.map((d,i)=>{
        const qText = qs[i]?.Question || 'Question '+(i+1);
        return `<div class="review-item ${d.isCorrect?'correct':'wrong'}">
          <div class="review-q">${d.isCorrect?'✓':'✗'} ${qText}</div>
          <div class="review-a">Your answer: <strong>${d.given}</strong>${d.isCorrect?'':` &nbsp;·&nbsp; Correct: <strong>${d.correct}</strong>`}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  screen.innerHTML = `
    <div class="score-ring">
      <div class="score-pct">${res.percentage}%</div>
      <div class="score-frac">${res.score}/${res.maxScore}</div>
    </div>
    <div class="result-title">${pass?'🎉 Well Done!':'📚 Keep Learning'}</div>
    <div class="result-msg">You scored <strong>${res.score} out of ${res.maxScore}</strong></div>
    <span class="pass-badge ${pass?'pass':'fail'}">${pass?'✓ Passed':'✗ Needs Improvement'}</span>
    ${reviewHtml}`;
}
</script>
</body>
</html>
