<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance — MAH Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="../js/config.js"></script>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#00c9b1;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--ink:#0a0e1a;--text:#e2e8f0;--text2:#94a3b8}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 70% at 30% 20%,rgba(0,201,177,.12),transparent 60%),radial-gradient(ellipse 60% 80% at 80% 80%,rgba(16,185,129,.08),transparent 60%),var(--ink);z-index:0}
.card{position:relative;z-index:1;background:rgba(30,30,48,.97);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 32px 64px rgba(0,0,0,.5)}
.logo{height:44px;background:white;padding:3px 7px;border-radius:8px;display:block;margin:0 auto 12px}
.icon-wrap{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--green));display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px;box-shadow:0 12px 32px rgba(0,201,177,.3)}
h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{font-size:12px;color:var(--text2);text-align:center;margin-bottom:16px}
.tbox{background:rgba(0,201,177,.08);border:1px solid rgba(0,201,177,.2);border-radius:10px;padding:12px 14px;margin-bottom:16px;text-align:center}
.tbox .tn{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--teal);margin-bottom:3px}
.tbox .tm{font-size:11px;color:var(--text2)}
.warn{background:rgba(245,158,11,.1);border:1.5px solid rgba(245,158,11,.3);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:#fcd34d;line-height:1.7}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:9px 12px;color:#fca5a5;font-size:13px;margin-top:8px;display:none}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input{width:100%;padding:14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:12px;color:var(--text);font-size:22px;font-family:'Syne',sans-serif;font-weight:700;text-align:center;letter-spacing:3px;outline:none;transition:all .2s;text-transform:uppercase}
input:focus{border-color:var(--teal);background:rgba(0,201,177,.06);box-shadow:0 0 0 4px rgba(0,201,177,.12)}
.prev{margin-top:8px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;font-size:13px;display:none}
.prev strong{display:block;font-size:14px;margin-bottom:2px}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--teal),#00a896);border:none;border-radius:12px;color:#0a0a14;font-size:15px;font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;transition:all .22s;margin-top:12px;box-shadow:0 8px 24px rgba(0,201,177,.3)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.result{display:none;text-align:center;padding:10px 0}
.ri{font-size:60px;margin-bottom:10px;animation:pop .4s ease}
.rt{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px}
.rm{font-size:13px;color:var(--text2);margin-bottom:14px}
.ecard{background:rgba(0,201,177,.08);border:1px solid rgba(0,201,177,.2);border-radius:10px;padding:12px;text-align:left;margin-bottom:12px}
.ecard .er{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.ecard .er:last-child{border:none}
.ecard .er span:first-child{color:var(--text2)}
.ecard .er span:last-child{font-weight:600}
.reset{width:100%;padding:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit}
.reset:hover{background:rgba(255,255,255,.09);color:var(--text)}
.sp{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#0a0a14;border-radius:50%;animation:ro .6s linear infinite;vertical-align:middle}
@keyframes ro{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <img class="logo" src="../assets/logo.jpg" alt="MAH" onerror="this.style.display='none'">
  <div class="icon-wrap">✅</div>
  <h1>Mark Attendance</h1>
  <p class="sub">Marengo Asia Hospitals Training</p>
  <div class="tbox" id="tbox"><span class="sp" style="border-top-color:var(--teal);border-color:rgba(0,201,177,.2)"></span></div>
  <div id="formSec" style="display:none">
    <div style="margin-bottom:12px">
      <label>Employee ID</label>
      <input type="text" id="eid" placeholder="EMP001" maxlength="12" autocomplete="off"
             oninput="onIn(this)" onkeydown="if(event.key==='Enter')mark()">
      <div class="prev" id="prev"><strong id="pn"></strong><span id="pi" style="color:var(--text2)"></span></div>
      <div class="err" id="eerr"></div>
    </div>
    <button class="btn" id="mBtn" onclick="mark()">Mark My Attendance ✓</button>
  </div>
  <div class="result" id="res">
    <div class="ri" id="ri"></div>
    <div class="rt" id="rt"></div>
    <div class="rm" id="rm"></div>
    <div id="rc"></div>
    <button class="reset" onclick="reset()">← Mark Another Person</button>
  </div>
</div>
<script>
const p=new URLSearchParams(location.search),tid=p.get('tid')||'';
let td=null,ed=null,lt=null;

window.addEventListener('load',async()=>{
  if(!tid){setBox('<span style="color:#ef4444">❌ Invalid QR</span>','');return;}
  if(CONFIG.isDemo){
    td={Title:'Advanced Cardiac Life Support',Department:'Cardiology',StartDate:'2025-02-10',Venue:'Skills Lab',StartTime:'08:00',Status:'Active'};
    show(td);return;
  }
  try{
    const r=await API.call('getTraining',{trainingId:tid});
    if(!r||!r.data){setBox('<span style="color:#ef4444">Training not found</span>','');return;}
    td=r.data; show(td);
  }catch(e){setBox('<span style="color:#ef4444">Error loading</span>','');}
});

function show(t){
  setBox(t.Title,`${t.Department} · ${t.Venue} · ${t.StartDate}${t.StartTime?' · '+t.StartTime:''}`);
  if(t.Status!=='Active'){
    document.getElementById('formSec').innerHTML=`<div class="warn">
      ⚠️ <strong>Attendance Not Open</strong><br>
      Training status is <strong>"${t.Status}"</strong><br>
      The organiser must <strong>Activate</strong> the training first.<br>
      <small style="opacity:.7">Contact: Training Organiser / HR</small>
    </div>`;
    document.getElementById('formSec').style.display='block';
  }else{
    document.getElementById('formSec').style.display='block';
    document.getElementById('eid').focus();
  }
}
function setBox(n,m){document.getElementById('tbox').innerHTML=`<div class="tn">${n}</div><div class="tm">${m}</div>`;}
function onIn(el){
  el.value=el.value.toUpperCase();
  document.getElementById('eerr').style.display='none';
  document.getElementById('prev').style.display='none';
  ed=null; clearTimeout(lt);
  if(el.value.length>=3) lt=setTimeout(()=>lookup(el.value),500);
}
async function lookup(id){
  if(CONFIG.isDemo){
    const d={EMP001:{Name:'Ravi Kumar',Designation:'Nurse',Department:'Emergency'},EMP002:{Name:'Priya Nair',Designation:'Sr. Nurse',Department:'Emergency'},EMP007:{Name:'Arun T.',Designation:'Cardiologist',Department:'Cardiology'}};
    ed=d[id]||null;
  }else{
    try{const r=await API.call('lookupEmployee',{empId:id});ed=r&&r.data?r.data:null;}catch(e){ed=null;}
  }
  const pv=document.getElementById('prev');
  if(ed){pv.style.display='block';document.getElementById('pn').textContent=ed.Name;document.getElementById('pi').textContent=`${ed.Designation} · ${ed.Department}`;}
}
async function mark(){
  const id=document.getElementById('eid').value.trim().toUpperCase();
  if(!id){showErr('Please enter your Employee ID.');return;}
  const btn=document.getElementById('mBtn');
  btn.disabled=true;btn.innerHTML='<span class="sp"></span> Marking...';
  if(CONFIG.isDemo){
    await new Promise(r=>setTimeout(r,600));
    if(!ed){btn.disabled=false;btn.textContent='Mark My Attendance ✓';showErr('Employee ID not found.');return;}
    showRes(true,'✅','Attendance Marked!',`Welcome, ${ed.Name}!`,ed);return;
  }
  try{
    const r=await API.call('markAttendance',{trainingId:tid,employeeId:id});
    btn.disabled=false;btn.textContent='Mark My Attendance ✓';
    if(r.success)showRes(true,'✅','Attendance Marked!',r.message,r.employee);
    else showErr(r.message||'Error.');
  }catch(e){btn.disabled=false;btn.textContent='Mark My Attendance ✓';showErr('Connection error.');}
}
function showErr(m){const e=document.getElementById('eerr');e.textContent=m;e.style.display='block';}
function showRes(ok,icon,title,msg,emp){
  document.getElementById('formSec').style.display='none';
  const rd=document.getElementById('res');rd.style.display='block';
  document.getElementById('ri').textContent=icon;
  document.getElementById('rt').textContent=title;
  document.getElementById('rm').textContent=msg;
  if(emp&&ok)document.getElementById('rc').innerHTML=`<div class="ecard">
    <div class="er"><span>Name</span><span>${emp.Name||emp.name||''}</span></div>
    <div class="er"><span>Department</span><span>${emp.Department||emp.dept||''}</span></div>
    <div class="er"><span>Designation</span><span>${emp.Designation||emp.desig||''}</span></div>
  </div>`;
}
function reset(){
  document.getElementById('res').style.display='none';
  document.getElementById('formSec').style.display='block';
  document.getElementById('eid').value='';
  document.getElementById('prev').style.display='none';
  document.getElementById('eerr').style.display='none';
  ed=null;document.getElementById('eid').focus();
}
</script>
</body>
</html>
