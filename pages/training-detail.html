<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Detail — Marengo Asia Hospitals Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar" id="topbar"></div>
    <main class="main" id="main">
      <div class="loader-full"><span class="spinner"></span><span style="margin-left:10px;color:var(--text2)">Loading training...</span></div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box modal-lg" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let trainingId, report, currentUser;
const QR_BASE = 'https://api.qrserver.com/v1/create-qr-code/?format=png&margin=10&color=1a1a2e&bgcolor=ffffff&size=';

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = Shell.init();
  if (!currentUser) return;
  const params = new URLSearchParams(window.location.search);
  trainingId = params.get('id');
  if (!trainingId) { location.href = 'trainings.html'; return; }
  await loadDetail();
});

async function loadDetail() {
  report = await SmartAPI.getReport(trainingId);
  if (!report || !report.training) { location.href = 'trainings.html'; return; }
  const t = report.training;
  Shell.setTopbarTitle(t.Title);

  document.getElementById('main').innerHTML = `
    <!-- Back + Header -->
    <div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="location.href='trainings.html'">← Back</button>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div class="page-title" style="font-size:22px">${t.Title}</div>
          <span class="badge badge-${Utils.statusColor(t.Status)}" style="font-size:13px;padding:5px 14px">${t.Status}</span>
        </div>
        <div class="page-sub">${t.Department} · ${t.Venue} · ${Utils.formatDate(t.StartDate)} · ${t.StartTime}–${t.EndTime}</div>
      </div>
      <div class="btn-group no-print">
        ${t.Status==='Scheduled'?`<button class="btn btn-success" onclick="changeStatus('Active')">▶ Activate Training</button>`:''}
        ${t.Status==='Active'?`<button class="btn btn-primary" onclick="changeStatus('Completed')">✓ Mark Complete & Notify HR</button>`:''}
        <button class="btn btn-ghost" onclick="sendHREmail()">📧 Email HR</button>
        <button class="btn btn-ghost" onclick="location.href='trainings.html'">✏️ Edit</button>
      </div>
    </div>

    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px" class="stat-row">
      ${mini(report.attendance.length,'Attendees','👥','teal')}
      ${mini(report.feedback.length,'Feedbacks','📝','violet')}
      ${mini(report.stats.avgRating+'/5','Avg Rating','⭐','gold')}
      ${mini(report.stats.avgTrainerRating+'/5','Trainer Rating','👨‍🏫','green')}
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" onclick="switchTab('overview',this)">📋 Overview</button>
      <button class="tab" onclick="switchTab('qrcodes',this)">📲 QR Codes</button>
      <button class="tab" onclick="switchTab('attendance',this)">✅ Attendance (${report.attendance.length})</button>
      <button class="tab" onclick="switchTab('feedback',this)">📝 Feedback (${report.feedback.length})</button>
      ${t.PreExamRequired==='TRUE'||t.PostExamRequired==='TRUE'?`<button class="tab" onclick="switchTab('exams',this)">📋 Exams</button>`:''}
      <button class="tab" onclick="switchTab('photos',this)">📷 Photos</button>
    </div>

    <div id="tab-overview">${renderOverview(t)}</div>
    <div id="tab-qrcodes" style="display:none">${renderQRCodes(t)}</div>
    <div id="tab-attendance" style="display:none">${renderAttendance()}</div>
    <div id="tab-feedback" style="display:none">${renderFeedback()}</div>
    ${t.PreExamRequired==='TRUE'||t.PostExamRequired==='TRUE'?`<div id="tab-exams" style="display:none">${renderExams(t)}</div>`:''}
    <div id="tab-photos" style="display:none">${renderPhotos()}</div>`;
}

function mini(n,label,icon,accent){
  const c={teal:'var(--teal)',gold:'var(--gold)',green:'var(--green)',violet:'var(--violet)'};
  return `<div class="stat-card" data-accent="${accent}" style="padding:16px">
    <div class="stat-icon" style="font-size:22px">${icon}</div>
    <div class="stat-num" style="color:${c[accent]};font-size:24px">${n}</div>
    <div class="stat-label">${label}</div>
  </div>`;
}

function switchTab(id, el) {
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display='none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const el2 = document.getElementById('tab-'+id);
  if (el2) el2.style.display = 'block';
  el.classList.add('active');
}

function renderOverview(t) {
  return `<div style="display:grid;grid-template-columns:2fr 1fr;gap:20px" class="ov-grid">
    <div class="card">
      <div class="card-title">Training Information</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0" class="detail-grid">
        ${det('Trainer',t.TrainerName)} ${det('Department',t.Department)}
        ${det('Date',Utils.formatDate(t.StartDate))} ${det('Time',t.StartTime+' – '+t.EndTime)}
        ${det('Venue',t.Venue)} ${det('Expected',t.ExpectedAttendees+' attendees')}
        ${det('Pre-Exam',t.PreExamRequired==='TRUE'?'✅ Yes':'❌ No')} ${det('Post-Exam',t.PostExamRequired==='TRUE'?'✅ Yes':'❌ No')}
        ${det('Certificate',t.CertificateEnabled==='TRUE'?'✅ Enabled':'❌ Disabled')} ${det('Show Results',t.ShowExamResults==='TRUE'?'✅ Yes':'❌ No')}
      </div>
      ${t.Description?`<div style="margin-top:16px;padding:14px;background:var(--surf3);border-radius:10px;color:var(--text2);font-size:13px;line-height:1.6">${t.Description}</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="background:var(--tealfade);border-color:rgba(0,201,177,.2)">
        <div style="font-size:28px;margin-bottom:8px">📈</div>
        <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--teal)">Attendance Rate</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--teal)">
          ${t.ExpectedAttendees>0?Math.round((report.attendance.length/parseInt(t.ExpectedAttendees))*100)+'%':'—'}
        </div>
        <div style="font-size:12px;color:var(--text2)">${report.attendance.length} of ${t.ExpectedAttendees} expected</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:13px;color:var(--text2);margin-bottom:6px">Training ID</div>
        <code style="font-size:13px;background:var(--surf3);padding:6px 12px;border-radius:8px;color:var(--teal)">${t.TrainingID}</code>
      </div>
    </div>
  </div>`;
}

function det(label, val) {
  return `<div style="padding:12px 16px;border-bottom:1px solid var(--border2)">
    <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${label}</div>
    <div style="font-weight:500">${val||'—'}</div>
  </div>`;
}

function renderQRCodes(t) {
  // Build base URL — uses current location for QR pages
  const base = window.location.origin + window.location.pathname.replace('training-detail.html','');
  const types = [
    { key:'attendance', label:'Attendance', icon:'✅', color:'#10b981', desc:'Display at venue. Employees scan & enter ID to mark attendance.', page:'attendance.html' },
    { key:'feedback',   label:'Feedback',   icon:'📝', color:'#6366f1', desc:'Show after training. Employees scan to fill feedback form.', page:'feedback.html' },
    ...(t.PreExamRequired==='TRUE'  ? [{ key:'preexam',  label:'Pre-Exam',  icon:'📋', color:'#f59e0b', desc:'Employees scan before training to take pre-assessment.', page:'exam.html?type=pre' }] : []),
    ...(t.PostExamRequired==='TRUE' ? [{ key:'postexam', label:'Post-Exam', icon:'📋', color:'#ef4444', desc:'Employees scan after training to take post-assessment.', page:'exam.html?type=post' }] : [])
  ];

  return `
    <div class="alert alert-info" style="margin-bottom:20px">
      <span>📌</span>
      <span>QR codes link employees directly to forms — <strong>no login needed</strong>. Print and display them at the venue.</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">
      ${types.map(q => {
        const url = `${base}${q.page}&tid=${trainingId}`;
        const qrUrl = Utils.generateQRDataURL(url, 200);
        return `<div class="qr-card" style="border-top:3px solid ${q.color}">
          <div style="font-size:32px;margin-bottom:8px">${q.icon}</div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:4px">${q.label}</div>
          <div style="font-size:12px;color:var(--text2);margin-bottom:16px;min-height:36px">${q.desc}</div>
          <div style="background:white;padding:12px;border-radius:12px;margin-bottom:14px;display:inline-block">
            <img src="${qrUrl}" width="160" height="160" alt="${q.label} QR" style="display:block;border-radius:6px" id="qrimg-${q.key}">
          </div>
          <div class="btn-group" style="justify-content:center">
            <button class="btn btn-ghost btn-sm" onclick="printQRSheet('${q.key}','${q.label}','${t.Subject}','${t.Title}','${url}')">🖨️ Print</button>
            <button class="btn btn-primary btn-sm" onclick="downloadQR('${q.key}','${q.label}')">⬇ Download</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function printQRSheet(key, label, subject, trainingTitle, url) {
  const qrUrl = Utils.generateQRDataURL(url, 300);
  const t = report.training;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .sheet{border:3px solid #1a1a2e;border-radius:16px;padding:32px;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.1)}
    .hospital{font-size:13px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
    .title{font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:4px;line-height:1.2}
    .subject{font-size:14px;color:#444;margin-bottom:20px;font-style:italic}
    .qr-wrap{background:#f8f9fa;border-radius:12px;padding:16px;display:inline-block;margin:0 auto 20px}
    .qr-wrap img{display:block}
    .label-box{background:#1a1a2e;color:#fff;padding:10px 24px;border-radius:8px;font-size:18px;font-weight:800;letter-spacing:1px;display:inline-block;margin-bottom:16px}
    .meta{font-size:12px;color:#888;line-height:2}
    .meta strong{color:#1a1a2e}
    .footer{margin-top:20px;font-size:11px;color:#aaa}
    @media print{body{padding:0}.sheet{box-shadow:none;border-radius:0;border:2px solid #1a1a2e;max-width:100%;min-height:100vh}}
  </style></head><body>
    <div class="sheet">
      <div class="hospital"><img src='../assets/logo.jpg' style='height:40px;filter:none;vertical-align:middle' onerror="this.outerHTML='Marengo Asia Hospitals'"> &nbsp; Marengo Asia Hospitals</div>
      <div class="title">${trainingTitle}</div>
      <div class="subject">${subject}</div>
      <div class="qr-wrap"><img src="${qrUrl}" width="220" height="220" alt="QR Code"></div>
      <div class="label-box">${label.toUpperCase()} QR</div>
      <div class="meta">
        <strong>Department:</strong> ${t.Department}<br>
        <strong>Date:</strong> ${Utils.formatDate(t.StartDate)}&nbsp;&nbsp;<strong>Time:</strong> ${t.StartTime} – ${t.EndTime}<br>
        <strong>Venue:</strong> ${t.Venue}<br>
        <strong>Trainer:</strong> ${t.TrainerName}
      </div>
      <div class="footer">Scan with your mobile camera · No login required</div>
    </div>
    <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`);
}

function downloadQR(key, label) {
  const img = document.getElementById('qrimg-'+key);
  if (!img) return Toast.show('QR not loaded yet.','warning');
  const a = document.createElement('a');
  a.href = img.src; a.download = label+'_QR.png'; a.target = '_blank'; a.click();
  Toast.show('QR downloaded!','success');
}

function renderAttendance() {
  const att = report.attendance;
  return `
    <div class="btn-group no-print" style="margin-bottom:16px">
      <button class="btn btn-ghost" onclick="downloadAttExcel()">📥 Download Excel</button>
      <button class="btn btn-ghost" onclick="printAttSheet()">🖨️ Print Attendance</button>
      ${report.training.CertificateEnabled==='TRUE'?`<button class="btn btn-violet" onclick="showCertManager()">🏆 Certificates</button>`:''}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Emp ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Marked At</th></tr></thead>
        <tbody>
          ${att.length===0?`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">No attendance yet</div><div class="empty-sub">QR scan attendance will appear here</div></div></td></tr>`:
            att.map((a,i)=>`<tr>
              <td style="color:var(--text3)">${i+1}</td>
              <td><code style="font-size:12px;background:var(--surf3);padding:2px 8px;border-radius:4px">${a.EmployeeID}</code></td>
              <td><strong>${a.EmployeeName}</strong></td>
              <td>${a.Department}</td>
              <td style="color:var(--text2)">${a.Designation}</td>
              <td style="color:var(--text3);font-size:12px">${Utils.formatDateTime(a.Timestamp)}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

function renderFeedback() {
  const fb = report.feedback;
  return `
    <div class="btn-group no-print" style="margin-bottom:16px">
      <button class="btn btn-ghost" onclick="downloadFbExcel()">📥 Download Excel</button>
      <button class="btn btn-ghost" onclick="printFeedback()">🖨️ Print Report</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Employee</th><th>Overall</th><th>Trainer</th><th>Comments</th><th>Time</th></tr></thead>
        <tbody>
          ${fb.length===0?`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">No feedback yet</div></div></td></tr>`:
            fb.map((f,i)=>`<tr>
              <td style="color:var(--text3)">${i+1}</td>
              <td><strong>${f.EmployeeName}</strong></td>
              <td>${stars(f.OverallRating)} <span style="font-size:12px;color:var(--text2)">${f.OverallRating}/5</span></td>
              <td>${stars(f.TrainerRating)} <span style="font-size:12px;color:var(--text2)">${f.TrainerRating}/5</span></td>
              <td style="color:var(--text2);max-width:200px">${f.Comments||'—'}</td>
              <td style="color:var(--text3);font-size:12px">${Utils.formatDateTime(f.Timestamp)}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

function renderExams(t) {
  return `
    <div class="btn-group no-print" style="margin-bottom:16px">
      <button class="btn btn-ghost" onclick="downloadExamExcel()">📥 Download Results Excel</button>
      ${t.PreExamRequired==='TRUE'?`<button class="btn btn-violet" onclick="openExamBuilder('pre')">📋 Edit Pre-Exam Questions</button>`:''}
      ${t.PostExamRequired==='TRUE'?`<button class="btn btn-danger" onclick="openExamBuilder('post')">📋 Edit Post-Exam Questions</button>`:''}
    </div>
    <div class="alert alert-info">
      <span>ℹ</span>
      <span>Exam results from employees appear here after submission. Add/edit questions via the exam builder.</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px" class="exam-grid">
      ${t.PreExamRequired==='TRUE'?examTable(report.preExamResults||[],'Pre-Exam Results'):''}
      ${t.PostExamRequired==='TRUE'?examTable(report.postExamResults||[],'Post-Exam Results'):''}
    </div>`;
}

function examTable(results, label) {
  return `<div class="card">
    <div class="card-title">📋 ${label}</div>
    ${results.length===0?`<div class="empty-state" style="padding:20px"><div class="empty-icon">📋</div><div class="empty-sub">No submissions yet</div></div>`:
      `<div class="table-wrap"><table>
        <thead><tr><th>Employee</th><th>Score</th><th>%</th><th>Result</th></tr></thead>
        <tbody>${results.map(r=>{
          const pct=parseFloat(r.Percentage)||0;
          return `<tr><td><strong>${r.EmployeeName}</strong></td>
            <td>${r.Score}/${r.MaxScore}</td>
            <td><strong>${r.Percentage}%</strong></td>
            <td><span class="badge ${pct>=50?'badge-green':'badge-red'}">${pct>=50?'Pass':'Fail'}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`}
  </div>`;
}

function renderPhotos() {
  const photos = report.photos || [];
  return `<div class="card">
    <div class="card-title" style="justify-content:space-between">
      📷 Training Photos
      <label class="btn btn-primary" style="cursor:pointer">
        📷 Add Photos
        <input type="file" accept="image/*" multiple capture="environment" style="display:none" onchange="uploadPhotos(this)">
      </label>
    </div>
    ${photos.length===0?`<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-title">No photos yet</div><div class="empty-sub">Capture training moments directly in the app</div></div>`:
      `<div class="photo-grid">${photos.map(p=>`<a href="${p.url}" target="_blank"><img class="photo-thumb" src="${p.thumb}" alt="${p.name}"></a>`).join('')}</div>`}
  </div>`;
}

function stars(val) {
  const n = Math.round(parseFloat(val)||0);
  return `<span style="color:var(--gold);letter-spacing:1px">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
}

async function changeStatus(status) {
  const msg = status==='Active'?'Activate this training? QR codes will go live.':'Mark as completed? HR will be auto-notified.';
  if (!confirm(msg)) return;
  const res = await SmartAPI.updateStatus(trainingId, status);
  if (res.success) { Toast.show(status==='Active'?'Training activated! QR codes are live.':'Training completed! HR notified.','success'); await loadDetail(); }
  else Toast.show('Error updating.','error');
}

async function sendHREmail() {
  Toast.show('Sending email to HR...','info');
  if (DEMO.isDemoMode()) return Toast.show('Demo mode: email simulated ✓','success');
  const res = await API.call('sendManualHREmail',{trainingId});
  Toast.show(res.message||'Done','success');
}

// ── EXAM BUILDER ──
let examQuestions = [], examType = '';
function openExamBuilder(type) {
  examType = type;
  examQuestions = (DEMO.examQuestions[trainingId+'_'+type] || []).map(q => ({...q}));
  renderExamModal();
}

function renderExamModal() {
  openModal(examType==='pre'?'Pre-Exam Question Builder':'Post-Exam Question Builder', `
    <div class="btn-group" style="margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" onclick="addQ()">＋ Add MCQ Question</button>
    </div>
    <div id="qList">${renderQList()}</div>
    <div class="btn-group" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveExamQs()">💾 Save Questions</button>
    </div>`,'modal-lg');
}

function renderQList() {
  if (!examQuestions.length) return `<div class="empty-state" style="padding:20px"><div class="empty-icon">📋</div><div class="empty-sub">No questions yet. Add one above.</div></div>`;
  return examQuestions.map((q,i) => `
    <div style="background:var(--surf3);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:12px;font-weight:600;color:var(--teal);text-transform:uppercase">Question ${i+1}</span>
        <button class="btn btn-danger btn-sm btn-icon" onclick="removeQ(${i})">🗑</button>
      </div>
      <div class="fg"><label>Question</label><textarea rows="2" id="qq${i}" style="width:100%;resize:none">${q.Question||q.question||''}</textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fg"><label>Option A</label><input type="text" id="qa${i}" value="${q.OptionA||q.optionA||''}"></div>
        <div class="fg"><label>Option B</label><input type="text" id="qb${i}" value="${q.OptionB||q.optionB||''}"></div>
        <div class="fg"><label>Option C</label><input type="text" id="qc${i}" value="${q.OptionC||q.optionC||''}"></div>
        <div class="fg"><label>Option D</label><input type="text" id="qd${i}" value="${q.OptionD||q.optionD||''}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fg"><label>Correct Answer</label>
          <select id="qcorr${i}">
            ${['A','B','C','D'].map(o=>`<option value="${o}" ${(q.CorrectOption||q.correct)===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="fg"><label>Marks</label><input type="number" id="qmarks${i}" value="${q.Marks||q.marks||1}" min="1"></div>
      </div>
    </div>`).join('');
}

function addQ() { examQuestions.push({Question:'',OptionA:'',OptionB:'',OptionC:'',OptionD:'',CorrectOption:'A',Marks:1}); document.getElementById('qList').innerHTML=renderQList(); }
function removeQ(i) { examQuestions.splice(i,1); document.getElementById('qList').innerHTML=renderQList(); }

async function saveExamQs() {
  const built = examQuestions.map((_,i) => ({
    question: document.getElementById('qq'+i).value,
    optionA: document.getElementById('qa'+i).value,
    optionB: document.getElementById('qb'+i).value,
    optionC: document.getElementById('qc'+i).value,
    optionD: document.getElementById('qd'+i).value,
    correct: document.getElementById('qcorr'+i).value,
    marks: parseInt(document.getElementById('qmarks'+i).value)||1
  }));
  if (DEMO.isDemoMode()) { DEMO.examQuestions[trainingId+'_'+examType] = built; closeModal(); Toast.show('Questions saved!','success'); return; }
  const res = await API.call('saveExamQuestions',{trainingId,examType,questions:built});
  if (res.success) { closeModal(); Toast.show('Questions saved!','success'); }
  else Toast.show('Error saving.','error');
}

function printCert() {
  const content = document.getElementById('certPrint').innerHTML;
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><style>body{margin:0;font-family:Georgia,serif;background:#0a0a14}</style></head><body>${content}<script>window.onload=()=>{window.print()}<\/script></body></html>`);
}

  Utils.downloadCSV(

function downloadExamExcel() {
  const pre = report.preExamResults||[], post = report.postExamResults||[];
  Utils.downloadCSV(
    [['Employee','Exam Type','Score','Max Score','Percentage','Result'],
     ...pre.map(r=>[r.EmployeeName,'Pre-Exam',r.Score,r.MaxScore,r.Percentage+'%',parseFloat(r.Percentage)>=50?'Pass':'Fail']),

// ── MODAL HELPERS ──
function openModal(title, body, size='') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalBox').className = 'modal-box ' + size;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===document.getElementById('modalOverlay')) closeModal(); });

function uploadPhotos(input) {
  if (!input.files.length) return;
  Toast.show('Demo: photo upload simulated ✓','success');
}
