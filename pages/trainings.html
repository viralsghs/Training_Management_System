<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainings — MAH Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar" id="topbar"></div>
    <main class="main" id="main">
      <div class="loader-full"><span class="spinner"></span><span style="margin-left:10px;color:var(--text2)">Loading trainings...</span></div>
    </main>
  </div>
</div>

<!-- TRAINING FORM MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box modal-lg" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">New Training</div>
      <button class="modal-close" onclick="Modal.close()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let allTrainings = [], allDepts = [], currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = Shell.init();
  if (!currentUser) return;

  Shell.setTopbarTitle('Trainings');
  Shell.setTopbarActions(`
    <button class="btn btn-primary" onclick="openTrainingForm()">＋ New Training</button>
  `);

  [allTrainings, allDepts] = await Promise.all([
    SmartAPI.getTrainings(currentUser.role, currentUser.department),
    SmartAPI.getDepartments()
  ]);
  renderPage();
});

function renderPage() {
  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Trainings</div>
        <div class="page-sub">${allTrainings.length} training programs found</div>
      </div>
      <button class="btn btn-primary btn-lg" onclick="openTrainingForm()">＋ New Training</button>
    </div>

    <!-- Status filter chips -->
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap" id="statusChips">
      ${['All','Draft','Scheduled','Active','Completed','Archived'].map((s,i)=>
        `<button class="chip ${i===0?'chip-active':''}" onclick="filterByStatus('${s}',this)">${s}</button>`
      ).join('')}
    </div>

    <!-- Search row -->
    <div class="search-row">
      <input type="text" class="fg" style="flex:1;padding:10px 14px;background:var(--surf3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none" 
        placeholder="🔍  Search by title, department, subject..." id="searchInput" oninput="filterTable()">
      <select style="padding:10px 14px;background:var(--surf3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;min-width:160px" 
        id="deptFilter" onchange="filterTable()">
        <option value="">All Departments</option>
        ${allDepts.map(d=>`<option value="${d.DeptName}">${d.DeptName}</option>`).join('')}
      </select>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table id="trainingsTable">
          <thead><tr>
            <th>Training</th><th>Department</th><th>Date & Time</th>
            <th>Venue</th><th>Trainer</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="trainingsBody">${renderRows(allTrainings)}</tbody>
        </table>
      </div>
    </div>`;
}

function renderRows(list) {
  if (!list.length) return `<tr><td colspan="7">
    <div class="empty-state"><div class="empty-icon">📅</div>
    <div class="empty-title">No trainings found</div>
    <div class="empty-sub">Create your first training to get started</div>
    </div></td></tr>`;

  return list.map(t => `
    <tr style="cursor:pointer" onclick="location.href='training-detail.html?id=${t.TrainingID}'">
      <td>
        <div style="font-weight:600;font-size:14px">${t.Title}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${t.Subject}</div>
        <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
          ${t.PreExamRequired==='TRUE'?'<span style="font-size:10px;background:var(--goldfade);color:var(--gold);padding:1px 7px;border-radius:4px;font-weight:600">Pre-Exam</span>':''}
          ${t.PostExamRequired==='TRUE'?'<span style="font-size:10px;background:var(--redfade);color:var(--red);padding:1px 7px;border-radius:4px;font-weight:600">Post-Exam</span>':''}
          ${t.CertificateEnabled==='TRUE'?'<span style="font-size:10px;background:var(--violfade);color:#a78bfa;padding:1px 7px;border-radius:4px;font-weight:600">🏆 Cert</span>':''}
        </div>
      </td>
      <td style="font-size:13px">${t.Department}</td>
      <td>
        <div style="font-weight:500">${Utils.formatDate(t.StartDate)}</div>
        <div style="font-size:11px;color:var(--text3)">${t.StartTime} – ${t.EndTime}</div>
      </td>
      <td style="color:var(--text2);font-size:13px">${t.Venue}</td>
      <td style="color:var(--text2);font-size:13px">${t.TrainerName}</td>
      <td><span class="badge badge-${Utils.statusColor(t.Status)}">${t.Status}</span></td>
      <td onclick="event.stopPropagation()">
        <div class="btn-group" style="gap:6px">
          <a href="training-detail.html?id=${t.TrainingID}" class="btn btn-ghost btn-sm">Open</a>
          ${t.Status==='Scheduled'?`<button class="btn btn-success btn-sm" onclick="changeStatus('${t.TrainingID}','Active')">▶ Activate</button>`:''}
          ${t.Status==='Active'?`<button class="btn btn-primary btn-sm" onclick="changeStatus('${t.TrainingID}','Completed')">✓ Complete</button>`:''}
          ${(t.Status==='Draft'||t.Status==='Scheduled')?`<button class="btn btn-ghost btn-sm" onclick="openTrainingForm('${t.TrainingID}')">✏️</button>`:''}
        </div>
      </td>
    </tr>`).join('');
}

let statusFilter = 'All';
function filterByStatus(s, el) {
  statusFilter = s;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip-active'));
  el.classList.add('chip-active');
  filterTable();
}

function filterTable() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const dept = document.getElementById('deptFilter').value;
  let filtered = allTrainings;
  if (statusFilter !== 'All') filtered = filtered.filter(t => t.Status === statusFilter);
  if (dept) filtered = filtered.filter(t => t.Department === dept);
  if (q) filtered = filtered.filter(t =>
    t.Title.toLowerCase().includes(q) || t.Subject.toLowerCase().includes(q) ||
    t.Department.toLowerCase().includes(q) || t.TrainerName.toLowerCase().includes(q)
  );
  document.getElementById('trainingsBody').innerHTML = renderRows(filtered);
}

async function changeStatus(id, status) {
  const label = status === 'Active' ? 'activate' : 'mark as complete';
  const extra = status === 'Completed' ? '\n\nAuto email will be sent to HR.' : '';
  if (!confirm(`${label.charAt(0).toUpperCase()+label.slice(1)} this training?${extra}`)) return;
  const res = await SmartAPI.updateStatus(id, status);
  if (res.success) {
    const t = allTrainings.find(x => x.TrainingID === id);
    if (t) t.Status = status;
    filterTable();
    Toast.show(`Training ${status === 'Active' ? 'activated! QR codes are now live.' : 'completed! HR notified.'}`, 'success');
  } else Toast.show('Error updating status.', 'error');
}

function openTrainingForm(trainingId) {
  const t = trainingId ? allTrainings.find(x => x.TrainingID === trainingId) : {};
  const v = k => t[k] || '';
  const c = (k, val='TRUE') => t[k]===val ? 'checked' : '';
  const dOpts = allDepts.map(d => `<option value="${d.DeptName}" ${v('Department')===d.DeptName?'selected':''}>${d.DeptName}</option>`).join('');

  document.getElementById('modalTitle').textContent = trainingId ? 'Edit Training' : 'New Training';
  document.getElementById('modalBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="form-g2">
      ${fi('Training Title *','tTitle',v('Title'),'e.g. Basic Life Support')}
      ${fi('Subject / Topic *','tSubject',v('Subject'),'e.g. CPR, Hand Hygiene')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="form-g2">
      ${fs('Department *','tDept',dOpts)}
      ${fi('Venue / Location *','tVenue',v('Venue'),'e.g. Training Hall A')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px" class="form-g3">
      ${fi('Date *','tDate',v('StartDate'),'','date')}
      ${fi('Start Time','tStart',v('StartTime'),'','time')}
      ${fi('End Time','tEnd',v('EndTime'),'','time')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="form-g2">
      ${fi('Trainer Name','tTrainer',v('TrainerName'),'Full name of trainer')}
      ${fi('Expected Attendees','tExpected',v('ExpectedAttendees'),'0','number')}
    </div>
    <div class="fg"><label>Description</label>
      <textarea id="tDesc" placeholder="Brief training description...">${v('Description')}</textarea>
    </div>
    <div class="card" style="background:var(--surf3);margin-bottom:16px">
      <div class="card-title" style="margin-bottom:12px">⚙️ Training Settings</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px">
        <label class="check-row"><input type="checkbox" id="tPreExam" ${c('PreExamRequired')}> Pre-exam required</label>
        <label class="check-row"><input type="checkbox" id="tPostExam" ${c('PostExamRequired')}> Post-exam required</label>
        <label class="check-row"><input type="checkbox" id="tShowResults" ${c('ShowExamResults')}> Show exam results to employee</label>
        <label class="check-row"><input type="checkbox" id="tCert" ${c('CertificateEnabled')}> Enable certificate generation 🏆</label>
      </div>
    </div>
    <div class="btn-group" style="justify-content:flex-end;gap:10px">
      <button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
      <button class="btn btn-primary btn-lg" onclick="saveTraining('${trainingId||''}')">💾 Save Training</button>
    </div>`;

  document.getElementById('modalOverlay').classList.add('open');
}

function fi(label, id, val, ph, type='text') {
  return `<div class="fg"><label>${label}</label><input type="${type}" id="${id}" value="${val}" placeholder="${ph}"></div>`;
}
function fs(label, id, opts) {
  return `<div class="fg"><label>${label}</label><select id="${id}">${opts}</select></div>`;
}
function gv(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function gc(id) { const e = document.getElementById(id); return e && e.checked ? 'TRUE' : 'FALSE'; }

async function saveTraining(trainingId) {
  const data = {
    TrainingID: trainingId || null,
    Title: gv('tTitle'), Subject: gv('tSubject'), Department: gv('tDept'),
    Venue: gv('tVenue'), TrainerName: gv('tTrainer'),
    ExpectedAttendees: gv('tExpected'), StartDate: gv('tDate'),
    StartTime: gv('tStart'), EndTime: gv('tEnd'),
    Description: gv('tDesc'),
    PreExamRequired: gc('tPreExam'), PostExamRequired: gc('tPostExam'),
    ShowExamResults: gc('tShowResults'), CertificateEnabled: gc('tCert'),
    CreatedBy: currentUser.email
  };
  if (!data.Title || !data.StartDate || !data.Department || !data.Venue) {
    return Toast.show('Please fill: Title, Department, Venue, Date.', 'warning');
  }
  const res = await SmartAPI.saveTraining(data);
  if (res.success) {
    Modal.close();
    Toast.show('Training saved successfully!', 'success');
    allTrainings = await SmartAPI.getTrainings(currentUser.role, currentUser.department);
    filterTable();
  } else Toast.show(res.message || 'Error saving.', 'error');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) Modal.close();
});
</script>
<style>
.chip{padding:7px 16px;border-radius:100px;border:1.5px solid var(--border);background:none;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .18s}
.chip:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.chip-active{background:var(--tealfade);border-color:rgba(0,201,177,.4);color:var(--teal)}
@media(max-width:700px){.form-g2,.form-g3{grid-template-columns:1fr!important}}
</style>
</body>
</html>
