<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employees — MAH Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar" id="topbar"></div>
    <main class="main" id="main">
      <div class="loader-full"><span class="spinner"></span><span style="margin-left:10px;color:var(--text2)">Loading employees...</span></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box modal-lg" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let allEmployees = [], allDepts = [], currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = Shell.init(['superadmin']);
  if (!currentUser) return;
  Shell.setTopbarTitle('Employees');
  Shell.setTopbarActions(`<button class="btn btn-primary" onclick="openForm()">＋ Add Employee</button>`);
  await loadData();
});

async function loadData() {
  [allEmployees, allDepts] = await Promise.all([SmartAPI.getEmployees(), SmartAPI.getDepartments()]);
  renderPage();
}

function renderPage() {
  const active = allEmployees.filter(e => e.Active !== 'FALSE');
  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Employee Master</div>
        <div class="page-sub">${active.length} active employees across ${allDepts.length} departments</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-ghost" onclick="showImportGuide()">📥 Bulk Import Guide</button>
        <button class="btn btn-primary btn-lg" onclick="openForm()">＋ Add Employee</button>
      </div>
    </div>

    <!-- Stats by dept -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px" id="deptChips">
      <button class="chip chip-active" onclick="filterDept('',this)">All (${active.length})</button>
      ${allDepts.map(d => {
        const cnt = active.filter(e => e.Department === d.DeptName).length;
        return cnt > 0 ? `<button class="chip" onclick="filterDept('${d.DeptName}',this)">${d.DeptName} (${cnt})</button>` : '';
      }).join('')}
    </div>

    <!-- Search -->
    <div class="search-row">
      <input type="text" id="empSearch" placeholder="🔍  Search by name, ID, designation..." 
        style="flex:1;padding:10px 14px;background:var(--surf3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none"
        oninput="filterTable()">
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Employee</th><th>Emp ID</th><th>Department</th>
            <th>Designation</th><th>Contact</th><th>Actions</th>
          </tr></thead>
          <tbody id="empBody">${renderRows(active)}</tbody>
        </table>
      </div>
    </div>`;
}

function renderRows(list) {
  if (!list.length) return `<tr><td colspan="6"><div class="empty-state">
    <div class="empty-icon">👥</div>
    <div class="empty-title">No employees found</div>
    <div class="empty-sub">Add employees or try a different search</div>
  </div></td></tr>`;

  return list.map(e => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink2);font-size:13px;flex-shrink:0">
            ${(e.Name||'?').charAt(0).toUpperCase()}
          </div>
          <div>
            <div style="font-weight:600">${e.Name}</div>
            ${e.Manager ? `<div style="font-size:11px;color:var(--text3)">Reports to: ${e.Manager}</div>` : ''}
          </div>
        </div>
      </td>
      <td><code style="font-size:12px;background:var(--surf3);padding:3px 8px;border-radius:5px;color:var(--teal)">${e.EmployeeID}</code></td>
      <td><span style="font-size:13px">${e.Department}</span></td>
      <td style="color:var(--text2)">${e.Designation}</td>
      <td>
        <div style="font-size:12px">${e.Email || '—'}</div>
        <div style="font-size:11px;color:var(--text3)">${e.Phone || ''}</div>
      </td>
      <td>
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm" onclick="openForm('${e.EmployeeID}')">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="removeEmployee('${e.EmployeeID}','${e.Name}')">🗑</button>
        </div>
      </td>
    </tr>`).join('');
}

let deptFilter = '';
function filterDept(dept, el) {
  deptFilter = dept;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip-active'));
  el.classList.add('chip-active');
  filterTable();
}

function filterTable() {
  const q = (document.getElementById('empSearch')?.value || '').toLowerCase();
  let list = allEmployees.filter(e => e.Active !== 'FALSE');
  if (deptFilter) list = list.filter(e => e.Department === deptFilter);
  if (q) list = list.filter(e =>
    e.Name.toLowerCase().includes(q) ||
    e.EmployeeID.toLowerCase().includes(q) ||
    (e.Designation||'').toLowerCase().includes(q) ||
    (e.Email||'').toLowerCase().includes(q)
  );
  document.getElementById('empBody').innerHTML = renderRows(list);
}

function openForm(empId) {
  const e = empId ? allEmployees.find(x => x.EmployeeID === empId) || {} : {};
  const v = k => e[k] || '';
  const dOpts = allDepts.map(d =>
    `<option value="${d.DeptName}" ${v('Department')===d.DeptName?'selected':''}>${d.DeptName}</option>`
  ).join('');

  document.getElementById('modalTitle').textContent = empId ? 'Edit Employee' : 'Add Employee';
  document.getElementById('modalBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="fg2">
      ${fi('Employee ID','eID', empId ? v('EmployeeID') : '', empId ? '' : 'Auto-generated if blank')}
      ${fi('Full Name *','eName',v('Name'),'Employee full name')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="fg2">
      ${fs('Department *','eDept',dOpts)}
      ${fi('Designation / Role *','eDesig',v('Designation'),'e.g. Nurse, Doctor, Technician')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="fg2">
      ${fi('Email','eEmail',v('Email'),'emp@hospital.com','email')}
      ${fi('Phone','ePhone',v('Phone'),'10-digit mobile number')}
    </div>
    ${fi('Manager / Supervisor Name','eManager',v('Manager'),'Direct manager or supervisor')}
    <div class="btn-group" style="justify-content:flex-end;gap:10px;margin-top:4px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-lg" onclick="saveEmployee('${empId||''}')">💾 Save Employee</button>
    </div>`;

  openModal();
}

function fi(label, id, val, ph, type='text') {
  return `<div class="fg"><label>${label}</label><input type="${type}" id="${id}" value="${val||''}" placeholder="${ph||''}"></div>`;
}
function fs(label, id, opts) {
  return `<div class="fg"><label>${label}</label><select id="${id}">${opts}</select></div>`;
}
function gv(id) { const e=document.getElementById(id); return e?e.value.trim():''; }

async function saveEmployee(empId) {
  const data = {
    EmployeeID: gv('eID') || null,
    Name: gv('eName'), Department: gv('eDept'),
    Designation: gv('eDesig'), Email: gv('eEmail'),
    Phone: gv('ePhone'), Manager: gv('eManager')
  };
  if (!data.Name || !data.Department || !data.Designation) {
    return Toast.show('Name, Department and Designation are required.', 'warning');
  }

  if (DEMO.isDemoMode()) {
    if (empId) {
      const idx = DEMO.employees.findIndex(e => e.EmployeeID === empId);
      if (idx >= 0) DEMO.employees[idx] = { ...DEMO.employees[idx], ...data };
    } else {
      const newId = data.EmployeeID || 'EMP' + String(DEMO.employees.length + 1).padStart(3,'0');
      DEMO.employees.push({ ...data, EmployeeID: newId, Active: 'TRUE' });
    }
    allEmployees = [...DEMO.employees];
    closeModal(); Toast.show('Employee saved!', 'success'); renderPage(); return;
  }

  const res = await API.call('saveEmployee', { ...data, empId });
  if (res.success) {
    closeModal(); Toast.show('Employee saved!', 'success'); await loadData();
  } else Toast.show(res.message || 'Error saving.', 'error');
}

async function removeEmployee(empId, name) {
  if (!confirm(`Remove ${name} from the system?\nThey will no longer be able to mark attendance.`)) return;
  if (DEMO.isDemoMode()) {
    const idx = DEMO.employees.findIndex(e => e.EmployeeID === empId);
    if (idx >= 0) DEMO.employees[idx].Active = 'FALSE';
    allEmployees = [...DEMO.employees];
    Toast.show('Employee removed.', 'success'); renderPage(); return;
  }
  const res = await API.call('deleteEmployee', { empId });
  if (res.success) { Toast.show('Employee removed.','success'); await loadData(); }
  else Toast.show('Error.','error');
}

function showImportGuide() {
  document.getElementById('modalTitle').textContent = '📥 Bulk Employee Import Guide';
  document.getElementById('modalBody').innerHTML = `
    <div class="alert alert-info" style="margin-bottom:16px">
      <span>ℹ</span>
      <span>For bulk import, prepare a CSV and paste rows directly into your Google Sheet's <strong>Employees</strong> tab.</span>
    </div>
    <div class="card" style="background:var(--surf3);margin-bottom:16px">
      <div class="card-title" style="font-size:13px;margin-bottom:10px">Required Column Order</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${['EmployeeID','Name','Department','Designation','Email','Phone','Manager','Active','CreatedDate']
          .map((c,i) => `<div style="background:var(--surf2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px"><span style="color:var(--text3);font-size:10px">Col ${i+1}</span><br><strong>${c}</strong></div>`)
          .join('')}
      </div>
    </div>
    <div style="font-size:13px;color:var(--text2);line-height:1.8">
      <div>• <strong>EmployeeID</strong>: e.g. EMP001 — must be unique</div>
      <div>• <strong>Active</strong>: set to <code style="background:var(--surf3);padding:1px 6px;border-radius:4px">TRUE</code></div>
      <div>• <strong>CreatedDate</strong>: leave blank or add today's date</div>
    </div>
    <div class="btn-group" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>`;
  openModal();
}

function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
</script>
<style>
.chip{padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);background:none;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.chip-active{background:var(--tealfade);border-color:rgba(0,201,177,.35);color:var(--teal)}
@media(max-width:700px){.fg2{grid-template-columns:1fr!important}}
</style>
</body>
</html>
