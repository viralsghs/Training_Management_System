<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — MedTrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar" id="topbar"></div>
    <main class="main" id="main">
      <div class="loader-full"><span class="spinner"></span><span style="color:var(--text2);margin-left:10px">Loading...</span></div>
    </main>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = Shell.init();
  if (!user) return;
  Shell.setTopbarTitle('Dashboard');
  await loadDashboard(user);
});

async function loadDashboard(user) {
  const trainings = await SmartAPI.getTrainings(user.role, user.department);
  const byS = s => trainings.filter(t => t.Status === s);
  const now = new Date(); const week = new Date(); week.setDate(now.getDate()+7);
  const upcoming = trainings.filter(t => {
    const d = new Date(t.StartDate+'T00:00');
    return d >= now && d <= week && t.Status !== 'Completed' && t.Status !== 'Archived';
  });
  const canCreate = ['superadmin','organiser','hr'].includes(user.role);
  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Good ${greeting()}, ${user.name.split(' ')[0]} 👋</div>
        <div class="page-sub">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
      ${canCreate?`<a href="trainings.html" class="btn btn-primary btn-lg">＋ New Training</a>`:''}
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px" class="stat-row">
      ${sCard(trainings.length,'Total','📅','teal')}
      ${sCard(byS('Scheduled').length,'Scheduled','🗓️','gold')}
      ${sCard(byS('Active').length,'Active','🔴','green')}
      ${sCard(byS('Completed').length,'Completed','✅','violet')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;margin-bottom:20px" class="dash-two">
      <div class="card">
        <div class="card-title" style="justify-content:space-between">🔴 Active Trainings<a href="trainings.html" class="btn btn-ghost btn-sm">View All</a></div>
        ${activeHtml(byS('Active'))}
      </div>
      <div class="card">
        <div class="card-title">🗓️ Upcoming This Week</div>
        ${upcomingHtml(upcoming)}
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="justify-content:space-between">📋 Recent Trainings<a href="trainings.html" class="btn btn-ghost btn-sm">View All →</a></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Title</th><th>Department</th><th>Date</th><th>Trainer</th><th>Status</th><th></th></tr></thead>
        <tbody>${trainings.slice(0,7).map(t=>`
          <tr style="cursor:pointer" onclick="location.href='training-detail.html?id=${t.TrainingID}'">
            <td><div style="font-weight:600">${t.Title}</div><div style="font-size:11px;color:var(--text3)">${t.Subject}</div></td>
            <td>${t.Department}</td>
            <td><div>${Utils.formatDate(t.StartDate)}</div><div style="font-size:11px;color:var(--text3)">${t.StartTime}–${t.EndTime}</div></td>
            <td style="color:var(--text2)">${t.TrainerName}</td>
            <td><span class="badge badge-${Utils.statusColor(t.Status)}">${t.Status}</span></td>
            <td><a href="training-detail.html?id=${t.TrainingID}" class="btn btn-ghost btn-sm">Open →</a></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

function sCard(n,label,icon,accent){
  const c={teal:'var(--teal)',gold:'var(--gold)',green:'var(--green)',violet:'var(--violet)'};
  return `<div class="stat-card" data-accent="${accent}"><div class="stat-icon">${icon}</div><div class="stat-num" style="color:${c[accent]}">${n}</div><div class="stat-label">${label}</div></div>`;
}
function activeHtml(list){
  if(!list.length) return `<div class="empty-state" style="padding:20px"><div class="empty-icon">🎯</div><div class="empty-sub">No active trainings right now</div></div>`;
  return list.map(t=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border2)">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--green);animation:gp 1.8s infinite;flex-shrink:0"></div>
        <div><div style="font-weight:600;font-size:14px">${t.Title}</div><div style="font-size:12px;color:var(--text3)">${t.Department} · ${t.Venue}</div></div>
      </div>
      <a href="training-detail.html?id=${t.TrainingID}" class="btn btn-primary btn-sm">Open</a>
    </div>`).join('');
}
function upcomingHtml(list){
  if(!list.length) return `<div class="empty-state" style="padding:20px"><div class="empty-icon">📅</div><div class="empty-sub">Nothing this week</div></div>`;
  return list.slice(0,5).map(t=>{
    const d=new Date(t.StartDate+'T00:00');
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border2)">
      <div style="background:var(--tealfade);border:1px solid rgba(0,201,177,.2);border-radius:10px;padding:6px 10px;text-align:center;min-width:46px;flex-shrink:0">
        <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--teal);line-height:1">${d.getDate()}</div>
        <div style="font-size:10px;color:var(--teal);text-transform:uppercase">${d.toLocaleDateString('en',{month:'short'})}</div>
      </div>
      <div><div style="font-weight:500;font-size:13px">${t.Title}</div><div style="font-size:11px;color:var(--text3)">${t.StartTime} · ${t.Department}</div></div>
    </div>`;
  }).join('');
}
function greeting(){const h=new Date().getHours();return h<12?'Morning':h<17?'Afternoon':'Evening';}
</script>
<style>
@keyframes gp{0%,100%{box-shadow:0 0 6px var(--green)}50%{box-shadow:0 0 14px var(--green)}}
@media(max-width:1000px){.stat-row{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:800px){.dash-two{grid-template-columns:1fr!important}}
</style>
</body>
</html>
